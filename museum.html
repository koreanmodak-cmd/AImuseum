<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MUSEUM : Exhibition Gallery</title>
    <!-- p5.js 및 Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-dark: #08080a;
            --panel-bg: #111116;
            --panel-border: #22222e;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            padding: 24px; min-height: 100vh;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--panel-border); padding-bottom: 20px; margin-bottom: 36px;
            flex-wrap: wrap; gap: 15px;
        }
        header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
        
        .nav-btn {
            color: #94a3b8; text-decoration: none; font-size: 0.88rem; font-weight: 500;
            padding: 8px 16px; border-radius: 6px; border: 1px solid var(--panel-border);
            transition: all 0.2s ease; background: #16161e;
        }
        .nav-btn:hover { color: #fff; border-color: #475569; background: #1e1e28; }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        .art-card {
            background: var(--panel-bg); border-radius: 8px; padding: 18px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid var(--panel-border); transition: transform 0.2s, border-color 0.2s;
        }
        .art-card:hover { transform: translateY(-4px); border-color: #334155; }
        
        .canvas-mount {
            width: 240px; height: 240px; border-radius: 4px; overflow: hidden;
            background: #000; display: flex; align-items: center; justify-content: center;
        }

        .art-info {
            margin-top: 14px; width: 100%; display: flex; justify-content: space-between; align-items: center;
        }
        .art-title { font-weight: 600; font-size: 0.95rem; color: #f8fafc; }
        .art-sub { font-size: 0.78rem; color: var(--text-muted); font-family: monospace; }
        
        .btn-delete {
            margin-top: 12px; width: 100%; padding: 8px; border-radius: 5px;
            border: 1px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.08);
            color: #ef4444; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }

        #loading { font-size: 0.9rem; color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 60px; }
    </style>
</head>
<body>

<header>
    <h1>🏛️ AI Museum Archive</h1>
    <a href="index.html" class="nav-btn">🎨 작품 창작소로 돌아가기</a>
</header>

<div class="gallery" id="gallery">

</div>
