<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Museum : 박물관</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            margin: 0; background: #0f172a; color: white;
            font-family: 'Pretendard', sans-serif; padding: 20px;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 30px;
        }
        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .art-card {
            background: #1e293b; border-radius: 10px; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .art-title { margin-top: 10px; font-weight: bold; color: #3b82f6; }
        .art-date { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
        a { color: #3b82f6; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>🏛️ AI 전시장 (Museum)</h1>
    <a href="index.html">← 작업실로 돌아가기</a>
</header>

<div class="gallery" id="gallery">
    <div id="loading">작품들을 불러오는 중입니다...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 한글 초성/중성 분해
    function extractHangul(str) {
        const chosung = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
        const jungsung = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
        let result = [];
        for (let i = 0; i < str.length; i++) {
            let code = str.charCodeAt(i) - 44032;
            if (code > -1 && code < 11172) {
                result.push(chosung[Math.floor(code / 588)]);
                result.push(jungsung[Math.floor((code % 588) / 28)]);
            } else {
                result.push(str[i]);
            }
        }
        return result.length > 0 ? result : ["X", "O"];
    }

    // Firestore에서 저장된 작품 불러오기
    async function loadMuseum() {
        const gallery = document.getElementById('gallery');
        try {
            const snapshot = await db.collection("museum_arts").orderBy("createdAt", "desc").limit(20).get();
            document.getElementById('loading').remove();

            if(snapshot.empty) {
                gallery.innerHTML = "<div>아직 전시된 작품이 없습니다.</div>";
                return;
            }

            snapshot.forEach((doc, idx) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'art-card';
                card.innerHTML = `
                    <div id="p5-art-${idx}"></div>
                    <div class="art-title">${data.author || '무명'}의 작품</div>
                `;
                gallery.appendChild(card);

                // p5.js 캔버스 렌더링 (인스턴스 모드)
                new p5((p) => {
                    p.setup = () => {
                        let canvas = p.createCanvas(250, 250);
                        p.randomSeed(data.seed);
                        p.noiseSeed(data.seed);
                        
                        p.background(20, 25, 30);
                        let colors = [
                            p.color(p.random(255), p.random(100), p.random(100)),
                            p.color(p.random(100), p.random(255), p.random(100)),
                            p.color(p.random(100), p.random(100), p.random(255))
                        ];

                        // 장르별 드로잉
                        if (data.genre === 0) {
                            p.noStroke();
                            for (let i = 0; i < 15; i++) {
                                p.fill(p.random(colors));
                                p.rect(p.random(p.width), p.random(p.height), p.random(20, 100), p.random(20, 100));
                            }
                        } else if (data.genre === 1) {
                            p.noFill(); p.strokeWeight(1.5);
                            for (let i = 0; i < 200; i++) {
                                p.stroke(p.random(colors));
                                p.beginShape();
                                let x = p.random(p.width), y = p.random(p.height);
                                for (let j = 0; j < 15; j++) {
                                    p.vertex(x, y);
                                    let angle = p.noise(x * 0.01, y * 0.01) * p.TWO_PI * 4;
                                    x += p.cos(angle) * 8; y += p.sin(angle) * 8;
                                }
                                p.endShape();
                            }
                        } else {
                            p.strokeWeight(p.random(1, 3));
                            for (let i = 0; i < 80; i++) {
                                p.stroke(p.random(colors));
                                p.line(p.random(p.width), p.random(p.height), p.random(p.width), p.random(p.height));
                            }
                        }

                        // 한글 문자 흩뿌리기
                        let letters = extractHangul(data.author || '무명');
                        p.textAlign(p.CENTER, p.CENTER);
                        for (let l of letters) {
                            p.push();
                            p.translate(p.random(p.width), p.random(p.height));
                            p.rotate(p.random(p.TWO_PI));
                            p.fill(255, 255, 255, p.random(50, 120));
                            p.textSize(p.random(20, 80));
                            p.text(l, 0, 0);
                            p.pop();
                        }
                        p.noLoop();
                    };
                }, `p5-art-${idx}`);
            });
        } catch (e) {
            console.error(e);
            gallery.innerHTML = "<div>작품을 불러오는 중 오류가 발생했습니다 (Firebase 규칙 확인 필요).</div>";
        }
    }

    loadMuseum();
</script>
</body>
</html>
