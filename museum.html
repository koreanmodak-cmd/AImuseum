<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Museum : 박물관</title>
    <!-- p5.js 및 Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #0f172a; color: white;
            font-family: 'Pretendard', sans-serif; padding: 20px;
            min-height: 100vh;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 30px;
            flex-wrap: wrap; gap: 10px;
        }
        header h1 { margin: 0; font-size: 1.5rem; }
        .back-link { color: #3b82f6; text-decoration: none; font-weight: bold; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }
        .art-card {
            background: #1e293b; border-radius: 12px; padding: 16px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4); border: 1px solid #334155;
        }
        .art-title { margin-top: 12px; font-weight: bold; color: #f8fafc; font-size: 1rem; }
        #loading { font-size: 1rem; color: #94a3b8; grid-column: 1 / -1; text-align: center; padding: 40px; }
    </style>
</head>
<body>

<header>
    <h1>🏛️ AI 전시장 (Museum)</h1>
    <a href="index.html" class="back-link">← 작업실로 돌아가기</a>
</header>

<div class="gallery" id="gallery">
    <div id="loading">작품들을 불러오는 중입니다...</div>
</div>

<script>
    /* =========================================
       1. Firebase 초기화
       ========================================= */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /* =========================================
       2. 한글 분해 함수
       ========================================= */
    function extractHangul(str) {
        const chosung = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
        const jungsung = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
        let result = [];
        for (let i = 0; i < str.length; i++) {
            let code = str.charCodeAt(i) - 44032;
            if (code > -1 && code < 11172) {
                result.push(chosung[Math.floor(code / 588)]);
                result.push(jungsung[Math.floor((code % 588) / 28)]);
            } else {
                result.push(str[i]);
            }
        }
        return result.length > 0 ? result : ["A", "R", "T"];
    }

    /* =========================================
       3. 데이터베이스 읽기 및 갤러리 렌더링
       ========================================= */
    async function loadMuseum() {
        const gallery = document.getElementById('gallery');
        try {
            const snapshot = await db.collection("museum_arts").orderBy("createdAt", "desc").limit(24).get();
            const loading = document.getElementById('loading');
            if (loading) loading.remove();

            if (snapshot.empty) {
                gallery.innerHTML = "<div style='color:#94a3b8; grid-column: 1/-1; text-align:center;'>아직 전시된 작품이 없습니다. 첫 작품을 전시해보세요!</div>";
                return;
            }

            snapshot.forEach((doc, idx) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'art-card';
                card.innerHTML = `
                    <div id="p5-art-${idx}" style="border-radius: 6px; overflow: hidden;"></div>
                    <div class="art-title">${data.author || '무명'}의 작품</div>
                `;
                gallery.appendChild(card);

                new p5((p) => {
                    p.setup = () => {
                        let canvas = p.createCanvas(230, 230);
                        p.randomSeed(data.seed);
                        p.noiseSeed(data.seed);
                        
                        p.background(15, 23, 42);
                        let colors = [
                            p.color(p.random(180, 255), p.random(50, 120), p.random(80, 150)),
                            p.color(p.random(50, 120), p.random(180, 255), p.random(180, 255)),
                            p.color(p.random(230, 255), p.random(180, 240), p.random(50, 100))
                        ];

                        if (data.genre === 0) {
                            p.noStroke();
                            for (let i = 0; i < 15; i++) {
                                p.fill(p.random(colors));
                                p.rect(p.random(p.width), p.random(p.height), p.random(20, 100), p.random(20, 100));
                            }
                        } else if (data.genre === 1) {
                            p.noFill(); p.strokeWeight(1.5);
                            for (let i = 0; i < 200; i++) {
                                p.stroke(p.random(colors));
                                p.beginShape();
                                let x = p.random(p.width), y = p.random(p.height);
                                for (let j = 0; j < 15; j++) {
                                    p.vertex(x, y);
                                    let angle = p.noise(x * 0.008, y * 0.008) * p.TWO_PI * 4;
                                    x += p.cos(angle) * 8; y += p.sin(angle) * 8;
                                }
                                p.endShape();
                            }
                        } else if (data.genre === 2) {
                            p.strokeWeight(p.random(1, 3));
                            for (let i = 0; i < 100; i++) {
                                p.stroke(p.random(colors));
                                p.line(p.random(p.width), p.random(p.height), p.random(p.width), p.random(p.height));
                            }
                        } else {
                            p.noStroke();
                            for (let i = 0; i < 12; i++) {
                                let c = p.random(colors);
                                p.fill(p.red(c), p.green(c), p.blue(c), p.random(70, 140));
                                p.circle(p.random(p.width), p.random(p.height), p.random(80, 250));
                            }
                        }

                        let letters = extractHangul(data.author || '무명');
                        p.textAlign(p.CENTER, p.CENTER);
                        for (let l of letters) {
                            p.push();
                            p.translate(p.random(p.width), p.random(p.height));
                            p.rotate(p.random(p.TWO_PI));
                            p.fill(255, 255, 255, p.random(80, 180));
                            p.textSize(p.random(20, 70));
                            p.text(l, 0, 0);
                            p.pop();
                        }
                        p.noLoop();
                    };
                }, `p5-art-${idx}`);
            });
        } catch (e) {
            console.error(e);
            gallery.innerHTML = "<div style='color:#ef4444; grid-column: 1/-1;'>작품을 불러오는 중 오류가 발생했습니다. (Firebase 보안 규칙을 확인하세요)</div>";
        }
    }

    loadMuseum();
</script>
</body>
</html>
