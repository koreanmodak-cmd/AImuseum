<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MUSEUM : Archive Gallery</title>
    <!-- p5.js 및 Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-dark: #08080a;
            --panel-bg: #101014;
            --panel-border: rgba(255, 255, 255, 0.07);
            --text-main: #f4f4f5;
            --text-muted: #71717a;
            --agent-red: #f43f5e;
            --agent-yellow: #eab308;
            --agent-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            padding: 28px; min-height: 100vh;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--panel-border); padding-bottom: 20px; margin-bottom: 24px;
            flex-wrap: wrap; gap: 15px;
        }
        header h1 { font-size: 0.95rem; letter-spacing: 3px; font-weight: 600; text-transform: uppercase; }
        
        .header-controls { display: flex; gap: 12px; align-items: center; }

        .tab-btn {
            background: transparent; border: 1px solid var(--panel-border); color: var(--text-muted);
            padding: 6px 12px; border-radius: 4px; font-size: 0.78rem; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { color: #fff; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.25); }

        .nav-btn {
            color: var(--text-muted); text-decoration: none; font-size: 0.8rem; font-weight: 500;
            padding: 7px 14px; border-radius: 4px; border: 1px solid var(--panel-border);
            transition: all 0.2s ease; letter-spacing: 0.5px;
        }
        .nav-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.03); }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        .art-card {
            background: var(--panel-bg); border-radius: 4px; padding: 18px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid var(--panel-border); transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .art-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
        
        .art-canvas-box {
            width: 100%; aspect-ratio: 1/1; border-radius: 2px; overflow: hidden; background: #000;
            pointer-events: none;
        }

        .art-info {
            margin-top: 14px; width: 100%; display: flex; justify-content: space-between; align-items: center;
        }
        .art-title { font-weight: 500; font-size: 0.85rem; color: #f4f4f5; font-family: monospace; }
        
        .art-actions { display: flex; gap: 8px; align-items: center; }

        .curate-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border);
            color: #a1a1aa; border-radius: 3px; padding: 3px 8px; font-size: 0.72rem;
            cursor: pointer; transition: 0.2s; font-family: monospace;
        }
        .curate-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

        .delete-btn {
            background: transparent; border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171; border-radius: 3px; padding: 3px 8px; font-size: 0.72rem;
            cursor: pointer; transition: 0.2s; font-family: sans-serif;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #fff; }

        #loading { font-size: 0.85rem; color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 60px; font-weight: 300; }

        /* 라이트박스 모달 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(4, 4, 6, 0.94); backdrop-filter: blur(16px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
            padding: 20px;
        }
        .modal-container {
            background: #111115; border: 1px solid var(--panel-border);
            border-radius: 6px; width: 100%; max-width: 900px;
            display: flex; gap: 24px; padding: 28px; max-height: 90vh; overflow-y: auto;
            position: relative; box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }
        .modal-canvas-side { flex: 1; min-width: 300px; display: flex; justify-content: center; align-items: center; }
        .modal-critique-side { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 16px; }
        .modal-close {
            position: absolute; top: 18px; right: 22px; color: var(--text-muted);
            background: transparent; border: none; font-size: 1.2rem; cursor: pointer;
        }
        .modal-close:hover { color: #fff; }

        .critique-title { font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; }
        .critique-item { display: flex; flex-direction: column; gap: 4px; }
        .critique-agent { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; font-family: monospace; color: var(--text-muted); }
        .critique-text { font-size: 0.82rem; color: #a1a1aa; line-height: 1.5; background: rgba(255,255,255,0.02); padding: 10px 12px; border-radius: 4px; }

        @media (max-width: 768px) {
            .modal-container { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <h1>Museum Archive Gallery</h1>
    <div class="header-controls">
        <button class="tab-btn active" id="tabLatest" onclick="switchSort('latest')">Latest</button>
        <button class="tab-btn" id="tabCurated" onclick="switchSort('curated')">Most Curated</button>
        <a href="index.html" class="nav-btn">Back to Studio</a>
    </div>
</header>

<div class="gallery" id="gallery">
    <div id="loading">Loading archived artworks...</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-container" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
        <div class="modal-canvas-side" id="modalCanvasBox"></div>
        <div class="modal-critique-side">
            <div class="critique-title" id="modalAuthorTitle">ARTIST CRITIQUE LOG</div>
            <div id="critiqueList" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
    </div>
</div>

<script>
    /* Firebase Config */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let modalP5Instance = null;
    let currentSortMode = 'latest';

    /* 거장 스타일 이식 2세대 Masterpiece Generative Engine (상대좌표 완전 일치) */
    const ArtEngine = {
        render: function(p, seed, genre, author) {
            p.randomSeed(seed);
            p.noiseSeed(seed);
            
            const w = p.width;
            const h = p.height;

            p.background(6, 6, 8);

            const palettes = [
                [p.color(180, 50, 35), p.color(215, 120, 45), p.color(110, 35, 30), p.color(240, 230, 210)],
                [p.color(30, 80, 180), p.color(230, 50, 40), p.color(240, 190, 40), p.color(20, 20, 25), p.color(245, 245, 240)],
                [p.color(210, 35, 42), p.color(35, 85, 185), p.color(245, 200, 45), p.color(15, 15, 18), p.color(245, 245, 242)],
                [p.color(240, 240, 245), p.color(160, 165, 175), p.color(80, 85, 95), p.color(25, 28, 35), p.color(16, 185, 129)],
                [p.color(245, 240, 230), p.color(20, 20, 25), p.color(180, 40, 30), p.color(210, 160, 60), p.color(80, 120, 110)],
                [p.color(250, 250, 250), p.color(10, 10, 12), p.color(235, 60, 110), p.color(0, 210, 190)],
                [p.color(245, 242, 235), p.color(15, 15, 18), p.color(210, 40, 30), p.color(60, 90, 160)],
                [p.color(195, 90, 60), p.color(225, 160, 115), p.color(110, 145, 125), p.color(245, 238, 225)],
                [p.color(25, 55, 105), p.color(65, 115, 160), p.color(235, 215, 180), p.color(215, 85, 65)],
                [p.color(15, 23, 42), p.color(59, 130, 246), p.color(139, 92, 246), p.color(244, 63, 94), p.color(248, 250, 252)]
            ];

            let palette = palettes[p.floor(p.random(0, palettes.length))];

            p.noFill();
            for (let r = w * 1.4; r > 0; r -= w * 0.025) {
                let c = p.random(palette);
                p.stroke(p.red(c), p.green(c), p.blue(c), 5);
                p.strokeWeight(w * 0.03);
                p.circle(w / 2, h / 2, r);
            }

            p.noStroke();
            for (let i = 0; i < 3; i++) {
                let c = p.random(palette);
                p.fill(p.red(c), p.green(c), p.blue(c), 25);
                p.rect(p.random(w * 0.1, w * 0.5), p.random(h * 0.1, h * 0.5), p.random(w * 0.3, w * 0.6), p.random(h * 0.3, h * 0.6), w * 0.04);
            }

            if (genre === 0) {
                p.noStroke();
                for (let i = 0; i < 6; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(110, 190));
                    let bw = p.random(w * 0.5, w * 0.85);
                    let bh = p.random(h * 0.18, h * 0.38);
                    let bx = (w - bw) / 2 + p.random(-w * 0.03, w * 0.03);
                    let by = p.random(h * 0.08, h * 0.85 - bh);
                    p.rect(bx, by, bw, bh, w * 0.01);
                }
            } else if (genre === 1) {
                for (let i = 0; i < 26; i++) {
                    let c = p.random(palette);
                    let st = p.floor(p.random(4));
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(120, 210));
                    p.stroke(0, 0, 0, 120); p.strokeWeight(w * 0.0015);
                    let sx = p.random(w * 0.1, w * 0.9);
                    let sy = p.random(h * 0.1, h * 0.9);
                    let sr = p.random(w * 0.04, w * 0.22);
                    if (st === 0) p.circle(sx, sy, sr);
                    else if (st === 1) p.rect(sx, sy, sr, sr * p.random(0.5, 2), w * 0.005);
                    else if (st === 2) p.triangle(sx, sy, sx + sr, sy - sr, sx - sr*0.5, sy + sr);
                    else {
                        p.noFill(); p.stroke(p.random(palette)); p.strokeWeight(w * 0.004);
                        p.arc(sx, sy, sr*1.5, sr*1.5, 0, p.PI * p.random(0.8, 1.8));
                    }
                }
                p.stroke(255, 255, 255, 140); p.strokeWeight(w * 0.003);
                p.line(w * 0.1, h * 0.85, w * 0.9, h * 0.15);
            } else if (genre === 2) {
                p.stroke(18, 18, 22); p.strokeWeight(w * 0.012);
                let cols = p.floor(p.random(3, 6));
                let rows = p.floor(p.random(3, 6));
                let cellW = w / cols;
                let cellH = h / rows;
                for (let c = 0; c < cols; c++) {
                    for (let r = 0; r < rows; r++) {
                        if (p.random(1) > 0.45) {
                            let col = p.random(palette);
                            p.fill(col);
                        } else {
                            p.fill(245, 245, 240);
                        }
                        p.rect(c * cellW, r * cellH, cellW, cellH);
                    }
                }
            } else if (genre === 3) {
                p.noStroke();
                for (let i = 0; i < 80; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(100, 200));
                    let sy = p.random(h);
                    let sh = p.random(h * 0.01, h * 0.08);
                    p.rect(0, sy, w, sh);
                    if (p.random(1) > 0.5) {
                        p.fill(255, 255, 255, p.random(30, 80));
                        p.rect(p.random(w), sy, p.random(w * 0.05, w * 0.2), sh * p.random(2, 5));
                    }
                }
            } else if (genre === 4) {
                p.noFill();
                for (let i = 0; i < 180; i++) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), p.random(120, 220));
                    p.strokeWeight(p.random(w * 0.001, w * 0.008));
                    p.beginShape();
                    let x = p.random(w), y = p.random(h);
                    for (let j = 0; j < 8; j++) {
                        p.curveVertex(x, y);
                        x += p.random(-w * 0.15, w * 0.15);
                        y += p.random(-h * 0.15, h * 0.15);
                    }
                    p.endShape();
                    if (p.random(1) > 0.4) {
                        p.noStroke(); p.fill(p.red(c), p.green(c), p.blue(c), p.random(150, 240));
                        p.circle(x, y, p.random(w * 0.004, w * 0.02));
                    }
                }
            } else if (genre === 5) {
                p.noFill(); p.strokeWeight(w * 0.002);
                for (let i = 0; i < 120; i++) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), p.random(140, 230));
                    p.beginShape();
                    for (let x = 0; x <= w; x += w * 0.02) {
                        let angle = (x * 0.015) + (i * 0.1);
                        let y = (i * (h / 120)) + p.sin(angle) * (h * 0.05);
                        p.vertex(x, y);
                    }
                    p.endShape();
                }
            } else if (genre === 6) {
                p.noStroke();
                for (let i = 0; i < 18; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(140, 230));
                    p.push();
                    p.translate(p.random(w * 0.15, w * 0.85), p.random(h * 0.15, h * 0.85));
                    p.rotate(p.random(-p.QUARTER_PI, p.QUARTER_PI));
                    p.rect(0, 0, p.random(w * 0.08, w * 0.4), p.random(h * 0.04, h * 0.25));
                    p.pop();
                }
            } else {
                p.noFill(); p.strokeWeight(w * 0.002);
                for (let i = 0; i < 110; i++) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), p.random(100, 200));
                    p.beginShape();
                    let x = p.random(w), y = p.random(h);
                    for (let j = 0; j < 15; j++) {
                        p.vertex(x, y);
                        let angle = p.noise(x * 0.003, y * 0.003) * p.TWO_PI * 6;
                        x += p.cos(angle) * (w * 0.02);
                        y += p.sin(angle) * (w * 0.02);
                    }
                    p.endShape();
                }
            }

            p.loadPixels();
            for (let i = 0; i < p.pixels.length; i += 4) {
                let grain = (p.random(-1, 1) * 15);
                p.pixels[i] = p.constrain(p.pixels[i] + grain, 0, 255);
                p.pixels[i+1] = p.constrain(p.pixels[i+1] + grain, 0, 255);
                p.pixels[i+2] = p.constrain(p.pixels[i+2] + grain, 0, 255);
            }
            p.updatePixels();

            p.push();
            let tag = `${(author || 'ANONYMOUS').toUpperCase()} // ED. #${seed.toString(16).toUpperCase().slice(-5)}`;
            p.textAlign(p.RIGHT, p.BOTTOM);
            p.textFont('monospace');
            p.textSize(p.max(8.5, w * 0.022));
            
            p.noStroke();
            p.fill(6, 6, 8, 220);
            let tw = p.textWidth(tag);
            p.rect(w - tw - (w * 0.05), h - (h * 0.07), tw + (w * 0.025), h * 0.045, 2);
            
            p.fill(244, 244, 245, 210);
            p.text(tag, w - (w * 0.035), h - (h * 0.035));
            p.pop();
        }
    };

    function switchSort(mode) {
        currentSortMode = mode;
        document.getElementById('tabLatest').classList.toggle('active', mode === 'latest');
        document.getElementById('tabCurated').classList.toggle('active', mode === 'curated');
        loadMuseum();
    }

    async function loadMuseum() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '<div id="loading">Loading archived artworks...</div>';

        try {
            let query = db.collection("museum_arts");
            if (currentSortMode === 'curated') {
                query = query.orderBy("curateCount", "desc");
            } else {
                query = query.orderBy("createdAt", "desc");
            }

            const snapshot = await query.limit(24).get();
            const loading = document.getElementById('loading');
            if (loading) loading.remove();

            if (snapshot.empty) {
                gallery.innerHTML = "<div style='color:#71717a; grid-column: 1/-1; text-align:center;'>No published artworks found.</div>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                const curates = data.curateCount || 0;

                const card = document.createElement('div');
                card.className = 'art-card';
                card.onclick = () => openLightboxModal(data, docId);

                const canvasBox = document.createElement('div');
                canvasBox.className = 'art-canvas-box';

                const infoBox = document.createElement('div');
                infoBox.className = 'art-info';
                infoBox.innerHTML = `
                    <span class="art-title">${data.author || 'ANONYMOUS'}</span>
                    <div class="art-actions">
                        <button class="curate-btn" onclick="curateArtwork(event, '${docId}', this)">Curate (${curates})</button>
                        <button class="delete-btn" onclick="deleteArtwork(event, '${docId}', '${data.password || ''}')">Delete</button>
                    </div>
                `;

                card.appendChild(canvasBox);
                card.appendChild(infoBox);
                gallery.appendChild(card);

                new p5((p) => {
                    p.setup = () => {
                        let w = canvasBox.clientWidth || 240;
                        p.createCanvas(w, w);
                        ArtEngine.render(p, data.seed, data.genre, data.author);
                        p.noLoop();
                    };
                }, canvasBox);
            });
        } catch (e) {
            console.error(e);
            gallery.innerHTML = "<div style='color:#f87171; grid-column: 1/-1; text-align:center;'>Error loading artworks.</div>";
        }
    }

    async function curateArtwork(event, docId, btnElem) {
        event.stopPropagation();
        try {
            await db.collection("museum_arts").doc(docId).update({
                curateCount: firebase.firestore.FieldValue.increment(1)
            });
            let currentNum = parseInt(btnElem.innerText.replace(/[^0-9]/g, '')) || 0;
            btnElem.innerText = `Curate (${currentNum + 1})`;
        } catch (e) {
            console.error("Curation error:", e);
        }
    }

    function openLightboxModal(data, docId) {
        const overlay = document.getElementById('modalOverlay');
        const modalCanvasBox = document.getElementById('modalCanvasBox');
        const critiqueList = document.getElementById('critiqueList');
        const modalAuthorTitle = document.getElementById('modalAuthorTitle');

        modalAuthorTitle.innerText = `${(data.author || 'ANONYMOUS').toUpperCase()} // CATALOGUE RECORD`;
        critiqueList.innerHTML = '';

        if (data.dialogue && Array.isArray(data.dialogue)) {
            data.dialogue.forEach(item => {
                const div = document.createElement('div');
                div.className = 'critique-item';
                div.innerHTML = `
                    <div class="critique-agent">${item.name}</div>
                    <div class="critique-text">${item.text}</div>
                `;
                critiqueList.appendChild(div);
            });
        } else {
            critiqueList.innerHTML = '<div class="critique-text">No dialogue transcript archived for this edition.</div>';
        }

        modalCanvasBox.innerHTML = '';
        if (modalP5Instance) modalP5Instance.remove();

        const sketch = (p) => {
            p.setup = () => {
                let w = p.min(modalCanvasBox.clientWidth || 380, 420);
                p.createCanvas(w, w);
                ArtEngine.render(p, data.seed, data.genre, data.author);
                p.noLoop();
            };
        };
        modalP5Instance = new p5(sketch, modalCanvasBox);

        overlay.style.display = 'flex';
    }

    function closeModal(event) {
        if (event.target.id === 'modalOverlay') closeModalDirect();
    }

    function closeModalDirect() {
        document.getElementById('modalOverlay').style.display = 'none';
        if (modalP5Instance) modalP5Instance.remove();
    }

    async function deleteArtwork(event, docId, correctPw) {
        event.stopPropagation();
        const inputPw = prompt("Enter the deletion password for this artwork:");
        if (inputPw === null) return;

        if (inputPw.trim() === correctPw) {
            try {
                await db.collection("museum_arts").doc(docId).delete();
                alert("Artwork deleted successfully.");
                location.reload();
            } catch (e) {
                alert("Deletion failed: " + e.message);
            }
        } else {
            alert("Incorrect password.");
        }
    }

    loadMuseum();
</script>
</body>
</html>
