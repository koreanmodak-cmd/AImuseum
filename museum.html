<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MUSEUM : Archive Gallery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-dark: #08080a;
            --panel-bg: #101014;
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            padding: 28px; min-height: 100vh;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--panel-border); padding-bottom: 20px; margin-bottom: 36px;
            flex-wrap: wrap; gap: 15px;
        }
        header h1 { font-size: 1.05rem; letter-spacing: 3px; font-weight: 600; text-transform: uppercase; }
        
        .nav-btn {
            color: var(--text-muted); text-decoration: none; font-size: 0.82rem; font-weight: 500;
            padding: 7px 14px; border-radius: 4px; border: 1px solid var(--panel-border);
            transition: all 0.2s ease; letter-spacing: 0.5px;
        }
        .nav-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.03); }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        .art-card {
            background: var(--panel-bg); border-radius: 4px; padding: 18px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid var(--panel-border); transition: transform 0.2s, border-color 0.2s;
        }
        .art-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
        
        .art-canvas-box {
            width: 100%; aspect-ratio: 1/1; border-radius: 2px; overflow: hidden; background: #000;
        }

        .art-info {
            margin-top: 14px; width: 100%; display: flex; justify-content: space-between; align-items: center;
        }
        .art-title { font-weight: 500; font-size: 0.88rem; color: #f8fafc; font-family: monospace; }
        
        .delete-btn {
            background: transparent; border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171; border-radius: 3px; padding: 3px 8px; font-size: 0.72rem;
            cursor: pointer; transition: 0.2s; font-family: sans-serif;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #fff; }

        #loading { font-size: 0.85rem; color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 60px; font-weight: 300; }
    </style>
</head>
<body>

<header>
    <h1>Museum Archive Gallery</h1>
    <a href="index.html" class="nav-btn">Back to Studio</a>
</header>

<div class="gallery" id="gallery">
    <div id="loading">Loading archived artworks...</div>
</div>

<script>
    /* Firebase Config */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /* index.html과 100% 동일한 통합 생성형 아트 엔진 */
    const ArtEngine = {
        render: function(p, seed, genre, author) {
            p.randomSeed(seed);
            p.noiseSeed(seed);
            p.pixelDensity(2);
            p.background(6, 6, 8);

            const palettes = [
                [p.color(240, 240, 245), p.color(180, 180, 190), p.color(90, 90, 100), p.color(225, 29, 72)],
                [p.color(225, 29, 72), p.color(234, 179, 8), p.color(30, 58, 138), p.color(248, 250, 252)],
                [p.color(20, 184, 166), p.color(99, 102, 241), p.color(244, 63, 94), p.color(255, 255, 255)],
                [p.color(217, 119, 6), p.color(180, 83, 9), p.color(120, 53, 15), p.color(254, 243, 199)],
                [p.color(244, 114, 182), p.color(129, 140, 248), p.color(52, 211, 153), p.color(30, 41, 59)]
            ];

            let palette = palettes[p.floor(p.random(0, palettes.length))];

            p.noFill();
            for (let r = p.width * 1.2; r > 0; r -= 15) {
                let c = p.random(palette);
                p.stroke(p.red(c), p.green(c), p.blue(c), 8);
                p.strokeWeight(12);
                p.circle(p.width / 2, p.height / 2, r);
            }

            if (genre === 0) {
                p.noStroke();
                for (let i = 0; i < 18; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(140, 220));
                    let w = p.random(p.width * 0.1, p.width * 0.45);
                    let h = p.random(p.height * 0.1, p.height * 0.45);
                    let x = p.random(p.width * 0.1, p.width * 0.8 - w);
                    let y = p.random(p.height * 0.1, p.height * 0.8 - h);
                    p.rect(x, y, w, h, p.random(0, 8));
                }
            } else if (genre === 1) {
                p.noFill();
                p.strokeWeight(p.random(0.8, 1.8));
                for (let i = 0; i < 450; i++) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), p.random(100, 200));
                    p.beginShape();
                    let x = p.random(p.width), y = p.random(p.height);
                    for (let j = 0; j < 22; j++) {
                        p.vertex(x, y);
                        let angle = p.noise(x * 0.004, y * 0.004) * p.TWO_PI * 4;
                        x += p.cos(angle) * 7; y += p.sin(angle) * 7;
                    }
                    p.endShape();
                }
            } else if (genre === 2) {
                p.strokeWeight(1);
                for (let i = 0; i < 220; i++) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), p.random(120, 240));
                    let x = p.random(p.width), y = p.random(p.height);
                    p.line(x, y, x + p.random(-150, 150), y);
                }
            } else {
                p.noStroke();
                for (let i = 0; i < 16; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(30, 90));
                    p.circle(p.random(p.width), p.random(p.height), p.random(120, 380));
                }
            }

            p.loadPixels();
            for (let i = 0; i < p.pixels.length; i += 4) {
                let grain = (p.random(-1, 1) * 16);
                p.pixels[i] = p.constrain(p.pixels[i] + grain, 0, 255);
                p.pixels[i+1] = p.constrain(p.pixels[i+1] + grain, 0, 255);
                p.pixels[i+2] = p.constrain(p.pixels[i+2] + grain, 0, 255);
            }
            p.updatePixels();

            p.push();
            let tag = `${(author || 'ANONYMOUS').toUpperCase()} // ED. #${seed.toString(16).toUpperCase().slice(-5)}`;
            p.textAlign(p.RIGHT, p.BOTTOM);
            p.textFont('monospace');
            p.textSize(p.max(8.5, p.width * 0.022));
            
            p.noStroke();
            p.fill(6, 6, 8, 220);
            let tw = p.textWidth(tag);
            p.rect(p.width - tw - 24, p.height - 34, tw + 12, 22, 2);
            
            p.fill(241, 245, 249, 210);
            p.text(tag, p.width - 18, p.height - 18);
            p.pop();
        }
    };

    /* 데이터베이스 로드 */
    async function loadMuseum() {
        const gallery = document.getElementById('gallery');
        try {
            const snapshot = await db.collection("museum_arts").orderBy("createdAt", "desc").limit(24).get();
            const loading = document.getElementById('loading');
            if (loading) loading.remove();

            if (snapshot.empty) {
                gallery.innerHTML = "<div style='color:#64748b; grid-column: 1/-1; text-align:center;'>No published artworks found.</div>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;

                const card = document.createElement('div');
                card.className = 'art-card';

                const canvasBox = document.createElement('div');
                canvasBox.className = 'art-canvas-box';

                const infoBox = document.createElement('div');
                infoBox.className = 'art-info';
                infoBox.innerHTML = `
                    <span class="art-title">${data.author || 'ANONYMOUS'}</span>
                    <button class="delete-btn" onclick="deleteArtwork('${docId}', '${data.password || ''}')">Delete</button>
                `;

                card.appendChild(canvasBox);
                card.appendChild(infoBox);
                gallery.appendChild(card);

                new p5((p) => {
                    p.setup = () => {
                        let w = canvasBox.clientWidth || 240;
                        p.createCanvas(w, w);
                        ArtEngine.render(p, data.seed, data.genre, data.author);
                        p.noLoop();
                    };
                }, canvasBox);
            });
        } catch (e) {
            console.error(e);
            gallery.innerHTML = "<div style='color:#ef4444; grid-column: 1/-1; text-align:center;'>Error loading artworks.</div>";
        }
    }

    async function deleteArtwork(docId, correctPw) {
        const inputPw = prompt("Enter the deletion password for this artwork:");
        if (inputPw === null) return;

        if (inputPw.trim() === correctPw) {
            try {
                await db.collection("museum_arts").doc(docId).delete();
                alert("Artwork deleted successfully.");
                location.reload();
            } catch (e) {
                alert("Deletion failed: " + e.message);
            }
        } else {
            alert("Incorrect password.");
        }
    }

    loadMuseum();
</script>
</body>
</html>
