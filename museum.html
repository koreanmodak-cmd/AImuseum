<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSEUM // ARCHIVE GALLERY</title>
    <!-- p5.js 및 Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-dark: #040405;
            --panel-bg: rgba(12, 12, 16, 0.85);
            --panel-border: rgba(255, 255, 255, 0.06);
            --text-main: #f4f4f5;
            --text-muted: #64646f;
            --agent-red: #f43f5e;
            --agent-yellow: #eab308;
            --agent-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            padding: 28px; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--panel-border); padding-bottom: 20px; margin-bottom: 24px;
            flex-wrap: wrap; gap: 15px;
        }
        header h1 { font-size: 0.9rem; letter-spacing: 4px; font-weight: 600; text-transform: uppercase; font-family: monospace; }
        
        .header-controls { display: flex; gap: 10px; align-items: center; }

        .lang-switch { display: flex; border: 1px solid var(--panel-border); border-radius: 2px; overflow: hidden; }
        .lang-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 5px 10px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: monospace;
        }
        .lang-btn.active { background: rgba(255,255,255,0.1); color: #fff; }

        .tab-btn {
            background: transparent; border: 1px solid var(--panel-border); color: var(--text-muted);
            padding: 5px 10px; border-radius: 2px; font-size: 0.72rem; cursor: pointer; transition: 0.2s; font-family: monospace;
        }
        .tab-btn.active { color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); }

        .nav-btn {
            color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 500;
            padding: 6px 12px; border-radius: 2px; border: 1px solid var(--panel-border);
            transition: all 0.25s ease; letter-spacing: 1px; font-family: monospace;
        }
        .nav-btn:hover { color: #fff; border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.03); }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
        }

        .art-card {
            background: var(--panel-bg); border-radius: 2px; padding: 16px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid var(--panel-border); transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .art-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); }
        
        .art-canvas-box {
            width: 100%; aspect-ratio: 1/1; border-radius: 1px; overflow: hidden; background: #000;
            pointer-events: none;
        }

        .art-info {
            margin-top: 14px; width: 100%; display: flex; justify-content: space-between; align-items: flex-start; flex-direction: column; gap: 8px;
        }
        .art-title-group { display: flex; flex-direction: column; gap: 2px; }
        .art-title { font-weight: 600; font-size: 0.8rem; color: #f4f4f5; font-family: monospace; }
        .art-author { font-size: 0.7rem; color: var(--text-muted); font-family: monospace; }
        
        .art-actions { display: flex; gap: 6px; align-items: center; width: 100%; justify-content: flex-end; }

        .curate-btn {
            background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border);
            color: #a1a1aa; border-radius: 2px; padding: 3px 7px; font-size: 0.68rem;
            cursor: pointer; transition: 0.2s; font-family: monospace;
        }
        .curate-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); }

        .delete-btn {
            background: transparent; border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171; border-radius: 2px; padding: 3px 7px; font-size: 0.68rem;
            cursor: pointer; transition: 0.2s; font-family: sans-serif;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.12); border-color: #ef4444; color: #fff; }

        #loading { font-size: 0.8rem; color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 60px; font-weight: 300; font-family: monospace; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 2, 3, 0.95); backdrop-filter: blur(20px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
            padding: 20px;
        }
        .modal-container {
            background: #08080c; border: 1px solid var(--panel-border);
            border-radius: 2px; width: 100%; max-width: 960px;
            display: flex; gap: 28px; padding: 32px; max-height: 90vh; overflow-y: auto;
            position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.9);
        }
        .modal-canvas-side { flex: 1; min-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .modal-art-title { font-size: 1rem; font-family: monospace; font-weight: 600; color: #fff; letter-spacing: 1px; text-align: center; }
        
        .modal-critique-side { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 14px; }
        .modal-close {
            position: absolute; top: 18px; right: 22px; color: var(--text-muted);
            background: transparent; border: none; font-size: 1.1rem; cursor: pointer;
        }
        .modal-close:hover { color: #fff; }

        .critique-title { font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; font-family: monospace; }
        .critique-item { display: flex; flex-direction: column; gap: 3px; }
        .critique-agent { font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; font-family: monospace; color: var(--text-muted); }
        .critique-text { font-size: 0.8rem; color: #a1a1aa; line-height: 1.5; background: rgba(255,255,255,0.015); padding: 9px 11px; border-radius: 2px; font-weight: 300; }

        @media (max-width: 768px) {
            .modal-container { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <h1 id="txt-title">MUSEUM ARCHIVE GALLERY</h1>
    <div class="header-controls">
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-lang-ko" onclick="setLanguage('ko')">KO</button>
            <button class="lang-btn" id="btn-lang-en" onclick="setLanguage('en')">EN</button>
        </div>
        <button class="tab-btn active" id="tabLatest" onclick="switchSort('latest')">Latest</button>
        <button class="tab-btn" id="tabCurated" onclick="switchSort('curated')">Most Curated</button>
        <a href="index.html" class="nav-btn" id="txt-nav-studio">BACK TO STUDIO</a>
    </div>
</header>

<div class="gallery" id="gallery">
    <div id="loading">Loading archived artworks...</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-container" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
        <div class="modal-canvas-side">
            <div id="modalCanvasBox"></div>
            <div class="modal-art-title" id="modalArtTitleName"></div>
        </div>
        <div class="modal-critique-side">
            <div class="critique-title" id="modalAuthorTitle">CATALOGUE RECORD</div>
            <div id="critiqueList" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>
</div>

<script>
    const i18n = {
        ko: {
            title: "MUSEUM ARCHIVE GALLERY",
            tabLatest: "Latest",
            tabCurated: "Most Curated",
            navStudio: "BACK TO STUDIO",
            loading: "소장 미술품을 로딩 중입니다...",
            noArts: "등록된 미술품이 없습니다.",
            deletePw: "삭제 비밀번호(4자리 이상)를 입력하세요:",
            deleteSuccess: "미술품이 성공적으로 삭제되었습니다.",
            pwError: "비밀번호가 일치하지 않습니다.",
            recordTitle: "CATALOGUE RECORD",
            titles: ["적색의 교향곡", "무제", "공간적 에튀드", "기억의 파편", "구조와 유체", "형태의 기원", "빛의 잔향", "시간의 경계", "심연", "공명하는 선"],
            dialogue: [
                "'{N}' 작가의 심상 패턴 스캔 중. 대기층 앰비언트 베이스 레이어 형성.",
                "Red 스펙트럼 확인. 공간 해체 및 파라메트릭 그리드 축 재구성.",
                "색채 음영 평형 연산. 디졸브 투명 오라 레이어 투입.",
                "현대미술 거장 기법 참조. 명도 및 텍스처 오버레이 격상.",
                "유체 퍼린 노이즈 벡터 교차 연산. 조형적 균형 안정화.",
                "시각적 긴장감 도달. 형태와 자율 구조의 상호작용 완료.",
                "린넨 캔버스 입자 질감 패스 완료. 시그니처 ED. #{S} 각인."
            ]
        },
        en: {
            title: "MUSEUM ARCHIVE GALLERY",
            tabLatest: "Latest",
            tabCurated: "Most Curated",
            navStudio: "BACK TO STUDIO",
            loading: "Loading archived artworks...",
            noArts: "No published artworks found.",
            deletePw: "Enter deletion password:",
            deleteSuccess: "Artwork deleted successfully.",
            pwError: "Incorrect password.",
            recordTitle: "CATALOGUE RECORD",
            titles: ["Symphony in Red", "Untitled", "Spatial Etude", "Fragments of Memory", "Structure & Fluid", "Origin of Form", "Reverberance", "Boundary of Time", "Abyss", "Resonating Lines"],
            dialogue: [
                "Initiating semantic spectral scan for '{N}'. Atmospheric aura forming.",
                "Acknowledged Red. Deconstructing spatial proportions & structural grid axes.",
                "Evaluating tonal equilibrium. Injecting dissolve opacity layers.",
                "Proposing contrast escalation inspired by modernist masterworks.",
                "Intersecting parametric noise vectors. Primary composition stabilized.",
                "Visual tension balanced. Harmony established between structure and fluid motion.",
                "Linen canvas texture pass complete. Stamped signature ED. #{S}."
            ]
        }
    };

    let currentLang = localStorage.getItem('art_studio_lang') || 'ko';
    let currentModalData = null; // To track open modal for translation update

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('art_studio_lang', lang);
        document.getElementById('btn-lang-ko').classList.toggle('active', lang === 'ko');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

        const t = i18n[lang];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('tabLatest').innerText = t.tabLatest;
        document.getElementById('tabCurated').innerText = t.tabCurated;
        document.getElementById('txt-nav-studio').innerText = t.navStudio;
        
        loadMuseum(); // Reload cards to update titles
        
        // Translate open modal if any
        if (currentModalData) {
            updateModalTranslations(currentModalData);
        }
    }

    function getArtTitle(seed, lang) {
        let idx = seed % 10;
        return `${i18n[lang].titles[idx]} No.${seed % 99}`;
    }

    function generateDialogueData(author, seed, lang) {
        const templates = i18n[lang].dialogue;
        const seedStr = seed.toString(16).slice(-5).toUpperCase();
        const agents = [
            { agent: 'agent-red', name: 'RED // 01' },
            { agent: 'agent-yellow', name: 'YELLOW // 02' },
            { agent: 'agent-green', name: 'GREEN // 03' },
            { agent: 'agent-red', name: 'RED // 01' },
            { agent: 'agent-yellow', name: 'YELLOW // 02' },
            { agent: 'agent-red', name: 'RED // 01' },
            { agent: 'agent-green', name: 'GREEN // 03' }
        ];
        return agents.map((ag, idx) => ({
            agent: ag.agent,
            name: ag.name,
            text: templates[idx].replace('{N}', author).replace('{S}', seedStr)
        }));
    }

    /* Firebase Config */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let modalP5Instance = null;
    let currentSortMode = 'latest';

    /* 16가지 완벽 일치 통합 파인아트 렌더링 엔진 */
    const ArtEngine = {
        render: function(p, seed, genre, author, currentStep = 7, fadeAlpha = 1.0) {
            p.randomSeed(seed);
            p.noiseSeed(seed);
            
            const w = p.width;
            const h = p.height;
            p.background(4, 4, 6);

            const getAlpha = (targetStep) => {
                if (currentStep < targetStep) return 0;
                if (currentStep === targetStep) return fadeAlpha;
                return 1.0;
            };

            const palettes = [
                [p.color(180, 50, 35), p.color(215, 120, 45), p.color(110, 35, 30), p.color(240, 230, 210)],
                [p.color(30, 80, 180), p.color(230, 50, 40), p.color(240, 190, 40), p.color(20, 20, 25), p.color(245, 245, 240)],
                [p.color(210, 35, 42), p.color(35, 85, 185), p.color(245, 200, 45), p.color(15, 15, 18), p.color(245, 245, 242)],
                [p.color(240, 240, 245), p.color(160, 165, 175), p.color(80, 85, 95), p.color(25, 28, 35), p.color(16, 185, 129)],
                [p.color(245, 240, 230), p.color(20, 20, 25), p.color(180, 40, 30), p.color(210, 160, 60), p.color(80, 120, 110)],
                [p.color(250, 250, 250), p.color(10, 10, 12), p.color(235, 60, 110), p.color(0, 210, 190)],
                [p.color(245, 242, 235), p.color(15, 15, 18), p.color(210, 40, 30), p.color(60, 90, 160)],
                [p.color(195, 90, 60), p.color(225, 160, 115), p.color(110, 145, 125), p.color(245, 238, 225)],
                [p.color(25, 55, 105), p.color(65, 115, 160), p.color(235, 215, 180), p.color(215, 85, 65)],
                [p.color(15, 23, 42), p.color(59, 130, 246), p.color(139, 92, 246), p.color(244, 63, 94), p.color(248, 250, 252)],
                [p.color(212, 175, 55), p.color(30, 30, 35), p.color(140, 110, 70), p.color(245, 240, 225)],
                [p.color(255, 182, 193), p.color(135, 206, 235), p.color(255, 255, 224), p.color(40, 50, 60)],
                [p.color(220, 20, 60), p.color(10, 10, 15), p.color(240, 240, 240)],
                [p.color(139, 69, 19), p.color(222, 184, 135), p.color(47, 79, 79), p.color(255, 250, 240)],
                [p.color(0, 255, 127), p.color(255, 0, 128), p.color(10, 10, 15)],
                [p.color(140, 140, 140), p.color(50, 50, 50), p.color(240, 240, 240)]
            ];

            let palette = palettes[p.floor(p.random(0, palettes.length))];

            // STEP 1: Aura
            let a1 = getAlpha(1);
            p.noFill();
            for (let r = w * 1.4; r > 0; r -= w * 0.025) {
                let c = p.random(palette);
                p.stroke(p.red(c), p.green(c), p.blue(c), 6 * a1);
                p.strokeWeight(w * 0.03);
                if (a1 > 0) p.circle(w / 2, h / 2, r);
            }

            // STEP 2~5: Shapes & Vectors
            let a_shapes = getAlpha(Math.min(currentStep, 5));
            if (currentStep >= 2) {
                if (genre === 0) {
                    p.noStroke();
                    for (let i = 0; i < 4; i++) {
                        let c = p.random(palette);
                        p.fill(p.red(c), p.green(c), p.blue(c), 140 * a_shapes);
                        let bw = p.random(w * 0.5, w * 0.85);
                        let bh = p.random(h * 0.18, h * 0.38);
                        let bx = (w - bw) / 2 + p.random(-w * 0.03, w * 0.03);
                        let by = p.random(h * 0.08, h * 0.85 - bh);
                        p.rect(bx, by, bw, bh, w * 0.01);
                    }
                } else if (genre === 1) {
                    for (let i = 0; i < 22; i++) {
                        let c = p.random(palette);
                        let st = p.floor(p.random(4));
                        p.fill(p.red(c), p.green(c), p.blue(c), 140 * a_shapes);
                        p.stroke(0, 0, 0, 100 * a_shapes); p.strokeWeight(w * 0.0015);
                        let sx = p.random(w * 0.1, w * 0.9);
                        let sy = p.random(h * 0.1, h * 0.9);
                        let sr = p.random(w * 0.04, w * 0.22);
                        if (st === 0) p.circle(sx, sy, sr);
                        else if (st === 1) p.rect(sx, sy, sr, sr * p.random(0.5, 2), w * 0.005);
                        else if (st === 2) p.triangle(sx, sy, sx + sr, sy - sr, sx - sr*0.5, sy + sr);
                        else {
                            p.noFill(); p.stroke(p.red(c), p.green(c), p.blue(c), 200 * a_shapes); p.strokeWeight(w * 0.004);
                            p.arc(sx, sy, sr*1.5, sr*1.5, 0, p.PI * p.random(0.8, 1.8));
                        }
                    }
                } else if (genre === 12) {
                    p.stroke(4, 4, 6, 240 * a_shapes); p.strokeWeight(w * 0.008);
                    for (let i = 0; i < 4; i++) {
                        let x1 = p.random(w * 0.2, w * 0.8);
                        let y1 = p.random(h * 0.1, h * 0.4);
                        p.line(x1, y1, x1 + p.random(-w * 0.1, w * 0.1), y1 + p.random(h * 0.3, h * 0.5));
                    }
                } else if (genre === 14) {
                    p.noStroke();
                    for (let i = 0; i < 40; i++) {
                        let c = p.random(palette);
                        p.fill(p.red(c), p.green(c), p.blue(c), 160 * a_shapes);
                        p.rect(p.random(w), p.random(h), p.random(w * 0.1, w * 0.4), p.random(h * 0.005, h * 0.02));
                    }
                } else if (genre === 4) {
                    p.noFill();
                    for (let i = 0; i < 150; i++) {
                        let c = p.random(palette);
                        p.stroke(p.red(c), p.green(c), p.blue(c), 160 * a_shapes);
                        p.strokeWeight(p.random(w * 0.001, w * 0.008));
                        p.beginShape();
                        let tx = p.random(w), ty = p.random(h);
                        for (let j = 0; j < 8; j++) {
                            p.curveVertex(tx, ty);
                            tx += p.random(-w * 0.15, w * 0.15);
                            ty += p.random(-h * 0.15, h * 0.15);
                        }
                        p.endShape();
                    }
                } else {
                    p.noFill();
                    for (let i = 0; i < 80; i++) {
                        let c = p.random(palette);
                        p.stroke(p.red(c), p.green(c), p.blue(c), 140 * a_shapes);
                        p.strokeWeight(p.random(w * 0.001, w * 0.006));
                        p.line(p.random(w), p.random(h), p.random(w), p.random(h));
                    }
                }
            }

            // STEP 6: 캔버스 실사 질감 패스
            let a6 = getAlpha(6);
            if (a6 > 0) {
                p.loadPixels();
                for (let i = 0; i < p.pixels.length; i += 4) {
                    let grain = (p.random(-1, 1) * 16 * a6);
                    p.pixels[i] = p.constrain(p.pixels[i] + grain, 0, 255);
                    p.pixels[i+1] = p.constrain(p.pixels[i+1] + grain, 0, 255);
                    p.pixels[i+2] = p.constrain(p.pixels[i+2] + grain, 0, 255);
                }
                p.updatePixels();
            }

            // STEP 7: 서명 각인
            let a7 = getAlpha(7);
            if (a7 > 0) {
                let tag = `${(author || 'ANONYMOUS').toUpperCase()} // ED. #${seed.toString(16).toUpperCase().slice(-5)}`;
                p.textAlign(p.RIGHT, p.BOTTOM);
                p.textFont('monospace');
                p.textSize(p.max(8.5, w * 0.022));
                
                p.noStroke();
                p.fill(4, 4, 6, 220 * a7);
                let tw = p.textWidth(tag);
                p.rect(w - tw - (w * 0.05), h - (h * 0.07), tw + (w * 0.025), h * 0.045, 2);
                
                p.fill(244, 244, 245, 210 * a7);
                p.text(tag, w - (w * 0.035), h - (h * 0.035));
            }
        }
    };

    function switchSort(mode) {
        currentSortMode = mode;
        document.getElementById('tabLatest').classList.toggle('active', mode === 'latest');
        document.getElementById('tabCurated').classList.toggle('active', mode === 'curated');
        loadMuseum();
    }

    async function loadMuseum() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = `<div id="loading">${i18n[currentLang].loading}</div>`;

        try {
            let query = db.collection("museum_arts");
            if (currentSortMode === 'curated') {
                query = query.orderBy("curateCount", "desc");
            } else {
                query = query.orderBy("createdAt", "desc");
            }

            const snapshot = await query.limit(24).get();
            const loading = document.getElementById('loading');
            if (loading) loading.remove();

            if (snapshot.empty) {
                gallery.innerHTML = `<div style='color:#71717a; grid-column: 1/-1; text-align:center;'>${i18n[currentLang].noArts}</div>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                const curates = data.curateCount || 0;
                const artTitle = getArtTitle(data.seed, currentLang);

                const card = document.createElement('div');
                card.className = 'art-card';
                card.onclick = () => openLightboxModal(data, docId);

                const canvasBox = document.createElement('div');
                canvasBox.className = 'art-canvas-box';

                const infoBox = document.createElement('div');
                infoBox.className = 'art-info';
                infoBox.innerHTML = `
                    <div class="art-title-group">
                        <span class="art-title">${artTitle}</span>
                        <span class="art-author">${data.author || 'ANONYMOUS'}</span>
                    </div>
                    <div class="art-actions">
                        <button class="curate-btn" onclick="curateArtwork(event, '${docId}', this)">Curate (${curates})</button>
                        <button class="delete-btn" onclick="deleteArtwork(event, '${docId}', '${data.password || ''}')">Delete</button>
                    </div>
                `;

                card.appendChild(canvasBox);
                card.appendChild(infoBox);
                gallery.appendChild(card);

                new p5((p) => {
                    p.setup = () => {
                        let w = canvasBox.clientWidth || 240;
                        p.createCanvas(w, w);
                        ArtEngine.render(p, data.seed, data.genre, data.author, 7, 1.0);
                        p.noLoop();
                    };
                }, canvasBox);
            });
        } catch (e) {
            console.error(e);
            gallery.innerHTML = "<div style='color:#f87171; grid-column: 1/-1; text-align:center;'>Error loading artworks.</div>";
        }
    }

    async function curateArtwork(event, docId, btnElem) {
        event.stopPropagation();
        try {
            await db.collection("museum_arts").doc(docId).update({
                curateCount: firebase.firestore.FieldValue.increment(1)
            });
            let currentNum = parseInt(btnElem.innerText.replace(/[^0-9]/g, '')) || 0;
            btnElem.innerText = `Curate (${currentNum + 1})`;
        } catch (e) {
            console.error("Curation error:", e);
        }
    }

    function openLightboxModal(data, docId) {
        currentModalData = data;
        const overlay = document.getElementById('modalOverlay');
        const modalCanvasBox = document.getElementById('modalCanvasBox');
        
        updateModalTranslations(data);

        modalCanvasBox.innerHTML = '';
        if (modalP5Instance) modalP5Instance.remove();

        const sketch = (p) => {
            p.setup = () => {
                let w = p.min(modalCanvasBox.clientWidth || 380, 420);
                p.createCanvas(w, w);
                ArtEngine.render(p, data.seed, data.genre, data.author, 7, 1.0);
                p.noLoop();
            };
        };
        modalP5Instance = new p5(sketch, modalCanvasBox);

        overlay.style.display = 'flex';
    }

    // Modal contents update handler for active translation
    function updateModalTranslations(data) {
        const critiqueList = document.getElementById('critiqueList');
        const modalAuthorTitle = document.getElementById('modalAuthorTitle');
        const modalArtTitleName = document.getElementById('modalArtTitleName');

        modalAuthorTitle.innerText = `${(data.author || 'ANONYMOUS').toUpperCase()} // ${i18n[currentLang].recordTitle}`;
        modalArtTitleName.innerText = getArtTitle(data.seed, currentLang);
        
        critiqueList.innerHTML = '';
        const dialogues = generateDialogueData(data.author, data.seed, currentLang);
        
        dialogues.forEach(item => {
            const div = document.createElement('div');
            div.className = 'critique-item';
            div.innerHTML = `
                <div class="critique-agent">${item.name}</div>
                <div class="critique-text">${item.text}</div>
            `;
            critiqueList.appendChild(div);
        });
    }

    function closeModal(event) {
        if (event.target.id === 'modalOverlay') closeModalDirect();
    }

    function closeModalDirect() {
        document.getElementById('modalOverlay').style.display = 'none';
        if (modalP5Instance) modalP5Instance.remove();
        currentModalData = null;
    }

    async function deleteArtwork(event, docId, correctPw) {
        event.stopPropagation();
        const inputPw = prompt(i18n[currentLang].deletePw);
        if (inputPw === null) return;

        if (inputPw.trim() === correctPw) {
            try {
                await db.collection("museum_arts").doc(docId).delete();
                alert(i18n[currentLang].deleteSuccess);
                location.reload();
            } catch (e) {
                alert("Deletion failed: " + e.message);
            }
        } else {
            alert(i18n[currentLang].pwError);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
    });
</script>
</body>
</html>
