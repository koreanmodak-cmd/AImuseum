<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace : Generative Art</title>
    <!-- p5.js 및 html2canvas 라이브러리 (무료 CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase SDK (무료 CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --red-color: #ef4444;
            --yellow-color: #f59e0b;
            --green-color: #10b981;
        }
        body {
            margin: 0; font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        header {
            padding: 15px 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid #334155;
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
        }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 400px; }
        input { 
            flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #475569; 
            background: #0f172a; color: white; min-width: 150px;
        }
        button {
            padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;
            background: #3b82f6; color: white; font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #2563eb; }
        .main-container { display: flex; flex: 1; overflow: hidden; flex-wrap: wrap; }
        .chat-panel {
            flex: 1; min-width: 300px; max-width: 35%; background: var(--panel-bg);
            padding: 20px; overflow-y: auto; border-right: 1px solid #334155;
        }
        .canvas-panel {
            flex: 2; min-width: 300px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; background: #000;
        }
        .chat-message { margin-bottom: 15px; opacity: 0; transform: translateY(10px); animation: fadeIn 0.5s forwards; }
        .chat-name { font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .chat-text { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; }
        
        .agent-red .chat-name { color: var(--red-color); }
        .agent-yellow .chat-name { color: var(--yellow-color); }
        .agent-green .chat-name { color: var(--green-color); }
        
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.red { background: var(--red-color); }
        .dot.yellow { background: var(--yellow-color); }
        .dot.green { background: var(--green-color); }

        #p5-container { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .action-buttons { margin-top: 20px; display: none; gap: 15px; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        
        /* 모바일 대응 */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .chat-panel { max-width: 100%; height: 35%; border-right: none; border-bottom: 1px solid #334155; }
            .canvas-panel { height: 65%; }
        }
    </style>
</head>
<body>

<header>
    <h2>🎨 AI Workspace</h2>
    <div class="input-group">
        <input type="text" id="userName" placeholder="이름을 입력하세요 (예: 홍길동)" autocomplete="off">
        <button id="startBtn">작품 창작하기</button>
    </div>
</header>

<div class="main-container">
    <div class="chat-panel" id="chatBox">
        <div style="color: #94a3b8; font-size: 0.9rem;">에이전트들이 대기 중입니다...</div>
    </div>
    <div class="canvas-panel">
        <div id="p5-container"></div>
        <div class="action-buttons" id="actionBtns">
            <button onclick="downloadCanvas()">🖼️ JPG로 저장</button>
            <button onclick="saveToMuseum()" style="background: #10b981;">🏛️ 박물관 전시</button>
        </div>
    </div>
</div>

<script>
    /* =========================================
       1. Firebase 초기화 (★사용자가 직접 변경해야 하는 부분★)
       ========================================= */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
        // storageBucket, messagingSenderId, appId 등
    };
    
    // Config가 더미값이 아닐 때만 초기화 진행
    let db;
    if(firebaseConfig.apiKey !== "더미API") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    }

    /* =========================================
       2. 상태 변수 및 시드(Seed)
       ========================================= */
    let currentSeed = 0;
    let canvasReady = false;
    let extractedLetters = [];
    let artGenre = 0;

    // 한글 초성/중성 분해 함수 (작품 요소로 활용)
    function extractHangul(str) {
        const chosung = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
        const jungsung = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
        let result = [];
        for (let i = 0; i < str.length; i++) {
            let code = str.charCodeAt(i) - 44032;
            if (code > -1 && code < 11172) {
                result.push(chosung[Math.floor(code / 588)]);
                result.push(jungsung[Math.floor((code % 588) / 28)]);
            } else {
                result.push(str[i]); // 영문이나 숫자는 그대로
            }
        }
        return result.length > 0 ? result : ["X", "O", "I", "Z"]; // 분해 실패시 기본 도형문자
    }

    /* =========================================
       3. AI 대화 다양화 생성기 (Procedural Text)
       ========================================= */
    const dialogFragments = {
        red_intro: ["이름의 주파수를 스캔했어.", "입력값을 시각적 데이터로 치환하는 중이야.", "독특한 에너지가 느껴지는 이름이네."],
        red_action: ["메인 베이스는 묵직한 난색 톤으로 깔아볼게.", "차가운 블루와 보라색 그라데이션이 어울릴 것 같아.", "명도를 높여서 강렬한 대비를 주도록 하지."],
        yellow_intro: ["데이터를 넘겨받았어.", "좋아, 난 공간을 분할해볼게.", "레드의 색상 위에 기하학을 얹을 시간이야."],
        yellow_genre: ["이번엔 현대적인 '바우하우스' 스타일 도형 배치를 써볼게.", "유체 역학 기반의 유기적 곡선(Flow Field)을 적용 중이야.", "사이버펑크 느낌의 노이즈 글리치 패턴으로 캔버스를 찢어볼게."],
        green_intro: ["마무리는 내게 맡겨.", "생명력을 불어넣을 차례네.", "질감과 디테일 연산을 시작할게."],
        green_action: ["추출된 자음/모음을 캔버스 곳곳에 추상적 요소로 흩뿌렸어.", "이름의 조각들이 공간을 부유하도록 배치했어.", "미세한 빛 입자와 텍스처를 얹어서 갤러리 작품처럼 렌더링 완료."]
    };

    function getRandom(array, seed) {
        // seed를 기반으로 유사 난수 생성하여 동일 이름엔 동일 텍스트 출력
        let x = Math.sin(seed++) * 10000;
        return array[Math.floor((x - Math.floor(x)) * array.length)];
    }

    /* =========================================
       4. 메인 진행 로직 (버튼 클릭 시)
       ========================================= */
    document.getElementById('startBtn').addEventListener('click', async () => {
        const name = document.getElementById('userName').value.trim();
        if (!name) return alert("이름을 입력해주세요!");

        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = ''; // 초기화
        document.getElementById('actionBtns').style.display = 'none';
        
        // 이름 기반 Seed 생성 (항상 같은 결과 도출)
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        currentSeed = Math.abs(hash) + Date.now(); // 타임스탬프 추가로 매번 다르게 하려면 Date.now() 유지
        randomSeed(currentSeed);
        noiseSeed(currentSeed);

        // 데이터 분석 세팅
        extractedLetters = extractHangul(name);
        artGenre = Math.floor(random(0, 4)); // 0~3 장르 선택

        // 1.5초 간격으로 채팅 렌더링
        let step = 0;
        const interval = setInterval(() => {
            if (step === 0) appendChat('agent-red', '🔴 Red', `${getRandom(dialogFragments.red_intro, currentSeed)} ${getRandom(dialogFragments.red_action, currentSeed + 1)}`);
            else if (step === 1) appendChat('agent-yellow', '🟡 Yellow', `${getRandom(dialogFragments.yellow_intro, currentSeed + 2)} ${getRandom(dialogFragments.yellow_genre, artGenre)}`);
            else if (step === 2) appendChat('agent-green', '🟢 Green', `${getRandom(dialogFragments.green_intro, currentSeed + 3)} ${getRandom(dialogFragments.green_action, currentSeed + 4)}`);
            else {
                clearInterval(interval);
                generateArt(); // 대화 종료 후 그림 그리기
            }
            step++;
        }, 1500);
    });

    function appendChat(className, aiName, text) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `chat-message ${className}`;
        div.innerHTML = `<div class="chat-name">${aiName}</div><div class="chat-text">${text}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* =========================================
       5. p5.js 아트 생성 엔진 (다양한 장르 구현)
       ========================================= */
    function setup() {
        let canvas = createCanvas(min(windowWidth * 0.6, 600), min(windowHeight * 0.6, 600));
        canvas.parent('p5-container');
        background(0);
        noLoop(); // 자동 실행 방지
    }

    function generateArt() {
        background(20, 25, 30);
        let colors = [
            color(random(255), random(100), random(100)),
            color(random(100), random(255), random(100)),
            color(random(100), random(100), random(255))
        ];

        // [장르별 드로잉 로직 분기]
        if (artGenre === 0) {
            // 장르 1: 바우하우스 스타일 기하학
            noStroke();
            for (let i = 0; i < 20; i++) {
                fill(random(colors));
                let shapeType = floor(random(3));
                if (shapeType === 0) rect(random(width), random(height), random(50, 200), random(50, 200));
                else if (shapeType === 1) circle(random(width), random(height), random(50, 250));
                else triangle(random(width), random(height), random(width), random(height), random(width), random(height));
            }
        } 
        else if (artGenre === 1) {
            // 장르 2: 추상 유동장 (Flow Field)
            noFill();
            strokeWeight(2);
            for (let i = 0; i < 500; i++) {
                stroke(random(colors));
                beginShape();
                let x = random(width), y = random(height);
                for (let j = 0; j < 20; j++) {
                    vertex(x, y);
                    let angle = noise(x * 0.01, y * 0.01) * TWO_PI * 4;
                    x += cos(angle) * 10;
                    y += sin(angle) * 10;
                }
                endShape();
            }
        }
        else if (artGenre === 2) {
            // 장르 3: 사이버펑크 글리치 (직선과 노이즈)
            strokeWeight(random(1, 5));
            for (let i = 0; i < 150; i++) {
                stroke(random(colors));
                let x = random(width);
                let y = random(height);
                line(x, y, x + random(-100, 100), y);
                if(random(1) > 0.8) rect(x, y, random(10, 50), random(2, 10));
            }
        }
        else {
            // 장르 4: 미니멀 유기체 (큰 원형 블러 효과 느낌)
            noStroke();
            for(let i=0; i<15; i++) {
                fill(red(colors[0]), green(colors[0]), blue(colors[0]), 100);
                circle(random(width), random(height), random(100, 400));
                colors = shuffle(colors);
            }
        }

        // [이름 요소 흩뿌리기 - 그린 에이전트의 역할]
        textAlign(CENTER, CENTER);
        textFont('sans-serif');
        for (let i = 0; i < extractedLetters.length; i++) {
            push();
            translate(random(width), random(height));
            rotate(random(TWO_PI));
            fill(255, 255, 255, random(50, 150));
            textSize(random(30, 150));
            text(extractedLetters[i], 0, 0);
            pop();
        }

        document.getElementById('actionBtns').style.display = 'flex';
    }

    /* =========================================
       6. 다운로드 및 박물관 연동 기능
       ========================================= */
    function downloadCanvas() {
        saveCanvas('my_ai_art', 'jpg');
    }

    async function saveToMuseum() {
        if(!db) {
            alert("⚠️ Firebase가 연결되지 않았습니다. 개발자가 Firebase Config를 설정해야 전시가 가능합니다.");
            return;
        }
        
        const name = document.getElementById('userName').value.trim();
        try {
            await db.collection("museum_arts").add({
                author: name,
                seed: currentSeed,
                genre: artGenre,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("박물관에 성공적으로 전시되었습니다! (museum.html을 열어 확인하세요)");
        } catch (e) {
            console.error(e);
            alert("전시 중 오류가 발생했습니다. Firebase 보안 규칙을 확인하세요.");
        }
    }
</script>
</body>
</html>
