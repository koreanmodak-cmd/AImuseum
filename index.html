<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WORKSPACE : Generative Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-dark: #08080a;
            --panel-bg: #101014;
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --agent-red: #f43f5e;
            --agent-yellow: #eab308;
            --agent-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
        }

        header {
            padding: 18px 32px; background: rgba(8, 8, 10, 0.95);
            border-bottom: 1px solid var(--panel-border);
            display: flex; gap: 20px; align-items: center; justify-content: space-between;
            backdrop-filter: blur(12px);
        }
        .header-brand { display: flex; align-items: center; gap: 24px; }
        .header-brand h1 { font-size: 0.95rem; letter-spacing: 3px; font-weight: 600; text-transform: uppercase; color: #fff; }
        
        .nav-btn {
            color: var(--text-muted); text-decoration: none; font-size: 0.82rem; font-weight: 500;
            padding: 7px 14px; border-radius: 4px; border: 1px solid var(--panel-border);
            transition: all 0.2s ease; letter-spacing: 0.5px;
        }
        .nav-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.03); }

        .input-group { display: flex; gap: 10px; width: 100%; max-width: 380px; }
        input {
            flex: 1; padding: 9px 14px; border-radius: 4px; border: 1px solid var(--panel-border);
            background: #121216; color: #fff; font-size: 0.85rem; outline: none; transition: 0.2s;
        }
        input:focus { border-color: rgba(255,255,255,0.3); }
        
        .btn-primary {
            padding: 9px 18px; border: 1px solid var(--panel-border); border-radius: 4px; cursor: pointer;
            background: #f8fafc; color: #0f172a; font-weight: 600; font-size: 0.82rem;
            transition: 0.2s; white-space: nowrap; letter-spacing: 0.5px;
        }
        .btn-primary:hover { background: #e2e8f0; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .chat-panel {
            flex: 1; min-width: 320px; max-width: 36%; background: var(--panel-bg);
            padding: 28px; overflow-y: auto; border-right: 1px solid var(--panel-border);
            display: flex; flex-direction: column; gap: 18px; height: calc(100vh - 65px);
        }
        .chat-placeholder { color: var(--text-muted); font-size: 0.85rem; line-height: 1.7; margin: auto 0; text-align: center; font-weight: 300; }

        .canvas-panel {
            flex: 2; min-width: 320px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            background: #040405; padding: 30px;
        }

        .chat-message {
            opacity: 0; transform: translateY(10px); animation: fadeIn 0.35s forwards ease-out;
            display: flex; flex-direction: column; gap: 6px;
        }
        .chat-header { font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .chat-header::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
        
        .agent-red .chat-header { color: var(--agent-red); }
        .agent-red .chat-header::before { background: var(--agent-red); }
        .agent-yellow .chat-header { color: var(--agent-yellow); }
        .agent-yellow .chat-header::before { background: var(--agent-yellow); }
        .agent-green .chat-header { color: var(--agent-green); }
        .agent-green .chat-header::before { background: var(--agent-green); }

        .chat-body {
            background: rgba(255, 255, 255, 0.02); padding: 14px 16px; border-radius: 4px;
            font-size: 0.85rem; line-height: 1.6; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.04); font-weight: 300;
        }

        #p5-container {
            box-shadow: 0 30px 60px rgba(0,0,0,0.9); border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
        }
        
        .action-buttons {
            margin-top: 24px; display: none; gap: 12px; justify-content: center;
        }
        .btn-secondary {
            padding: 9px 18px; border-radius: 4px; border: 1px solid var(--panel-border);
            background: #121216; color: #e2e8f0; font-size: 0.82rem; font-weight: 500;
            cursor: pointer; transition: 0.2s; letter-spacing: 0.5px;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); color: #fff; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 868px) {
            body { overflow-y: auto; }
            .main-container { flex-direction: column; }
            .chat-panel { max-width: 100%; height: 320px; border-right: none; border-bottom: 1px solid var(--panel-border); }
            .canvas-panel { min-height: 480px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-brand">
        <h1>AI Studio</h1>
        <a href="museum.html" class="nav-btn">Museum Gallery</a>
    </div>
    <div class="input-group">
        <input type="text" id="userName" placeholder="Artist Name" autocomplete="off">
        <button id="startBtn" class="btn-primary">Generate Art</button>
    </div>
</header>

<div class="main-container">
    <div class="chat-panel" id="chatBox">
        <div class="chat-placeholder">Enter an artist name to initiate the synthesis dialogue between Agent Red, Yellow, and Green.</div>
    </div>
    <div class="canvas-panel">
        <div id="p5-container"></div>
        <div class="action-buttons" id="actionBtns">
            <button class="btn-secondary" onclick="downloadCanvas()">Export Canvas</button>
            <button class="btn-secondary" onclick="saveToMuseum()">Publish to Museum</button>
        </div>
    </div>
</div>

<script>
    /* Firebase Config */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentSeed = 0;
    let userNameVal = "";
    let artGenre = 0;
    let p5Instance = null;

    /* 고품격 통합 생성형 아트 엔진 (Texture & Grain 지원) */
    const ArtEngine = {
        render: function(p, seed, genre, author) {
            p.randomSeed(seed);
            p.noiseSeed(seed);
            p.pixelDensity(2);
            p.background(6, 6, 8);

            const palettes = [
                [p.color(240, 240, 245), p.color(180, 180, 190), p.color(90, 90, 100), p.color(225, 29, 72)],
                [p.color(225, 29, 72), p.color(234, 179, 8), p.color(30, 58, 138), p.color(248, 250, 252)],
                [p.color(20, 184, 166), p.color(99, 102, 241), p.color(244, 63, 94), p.color(255, 255, 255)],
                [p.color(217, 119, 6), p.color(180, 83, 9), p.color(120, 53, 15), p.color(254, 243, 199)],
                [p.color(244, 114, 182), p.color(129, 140, 248), p.color(52, 211, 153), p.color(30, 41, 59)]
            ];

            let palette = palettes[p.floor(p.random(0, palettes.length))];

            // 1. 깊이감을 위한 그래디언트 필드
            p.noFill();
            for (let r = p.width * 1.2; r > 0; r -= 15) {
                let c = p.random(palette);
                p.stroke(p.red(c), p.green(c), p.blue(c), 8);
                p.strokeWeight(12);
                p.circle(p.width / 2, p.height / 2, r);
            }

            // 2. 장르별 핵심 아키텍처
            if (genre === 0) {
                // Bauhaus Minimalist Structure
                p.noStroke();
                for (let i = 0; i < 18; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(140, 220));
                    let w = p.random(p.width * 0.1, p.width * 0.45);
                    let h = p.random(p.height * 0.1, p.height * 0.45);
                    let x = p.random(p.width * 0.1, p.width * 0.8 - w);
                    let y = p.random(p.height * 0.1, p.height * 0.8 - h);
                    p.rect(x, y, w, h, p.random(0, 8));
                }
            } else if (genre === 1) {
                // Organic Fluid Field
                p.noFill();
                p.strokeWeight(p.random(0.8, 1.8));
                for (let i = 0; i < 450; i++) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), p.random(100, 200));
                    p.beginShape();
                    let x = p.random(p.width), y = p.random(p.height);
                    for (let j = 0; j < 22; j++) {
                        p.vertex(x, y);
                        let angle = p.noise(x * 0.004, y * 0.004) * p.TWO_PI * 4;
                        x += p.cos(angle) * 7; y += p.sin(angle) * 7;
                    }
                    p.endShape();
                }
            } else if (genre === 2) {
                // Constructivist Glitch Matrix
                p.strokeWeight(1);
                for (let i = 0; i < 220; i++) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), p.random(120, 240));
                    let x = p.random(p.width), y = p.random(p.height);
                    p.line(x, y, x + p.random(-150, 150), y);
                }
            } else {
                // Ambient Aurora Sphere
                p.noStroke();
                for (let i = 0; i < 16; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), p.random(30, 90));
                    p.circle(p.random(p.width), p.random(p.height), p.random(120, 380));
                }
            }

            // 3. 미세 필름 그레인 & 질감 오버레이 (Canvas Texture Engine)
            p.loadPixels();
            for (let i = 0; i < p.pixels.length; i += 4) {
                let grain = (p.random(-1, 1) * 16);
                p.pixels[i] = p.constrain(p.pixels[i] + grain, 0, 255);
                p.pixels[i+1] = p.constrain(p.pixels[i+1] + grain, 0, 255);
                p.pixels[i+2] = p.constrain(p.pixels[i+2] + grain, 0, 255);
            }
            p.updatePixels();

            // 4. 우측 하단 아티스트 시그니처 배지
            p.push();
            let tag = `${(author || 'ANONYMOUS').toUpperCase()} // ED. #${seed.toString(16).toUpperCase().slice(-5)}`;
            p.textAlign(p.RIGHT, p.BOTTOM);
            p.textFont('monospace');
            p.textSize(p.max(8.5, p.width * 0.022));
            
            p.noStroke();
            p.fill(6, 6, 8, 220);
            let tw = p.textWidth(tag);
            p.rect(p.width - tw - 24, p.height - 34, tw + 12, 22, 2);
            
            p.fill(241, 245, 249, 210);
            p.text(tag, p.width - 18, p.height - 18);
            p.pop();
        }
    };

    /* 대화 시스템 프래그먼트 */
    const vocabulary = {
        red_1: [
            ["Analyzing structural resonance of '{N}'.", "Scanning semantic profile for '{N}'."],
            ["Setting foundational color space to deep matte tones.", "Establishing dark crimson contrast base."]
        ],
        yellow_1: [
            ["Received Red's color space. Initiating spatial partition.", "Acknowledged. Constructing geometric tension."],
            ["Applying golden ratio grid system.", "Injecting vector flow field calculations."]
        ],
        green_1: [
            ["Integrating luminous texture layers.", "Adjusting airiness and spectral opacity."],
            ["Applying film grain pass and texture synthesis.", "Artwork synthesis complete. Registered signature label."]
        ]
    };

    function pseudoSelect(arr, seed) {
        let idx = Math.floor((Math.sin(seed) * 10000 - Math.floor(Math.sin(seed) * 10000)) * arr.length);
        return arr[idx];
    }

    /* 이벤트 바인딩 */
    document.getElementById('startBtn').addEventListener('click', () => {
        const nameInput = document.getElementById('userName').value.trim();
        if (!nameInput) return alert("Please enter an artist name.");
        userNameVal = nameInput;

        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        document.getElementById('actionBtns').style.display = 'none';

        let hash = 0;
        for (let i = 0; i < userNameVal.length; i++) hash = userNameVal.charCodeAt(i) + ((hash << 5) - hash);
        currentSeed = Math.abs(hash) + Date.now();
        artGenre = Math.floor((currentSeed % 100) / 25) % 4;

        const script = [
            { agent: 'agent-red', name: 'AGENT RED', text: `${pseudoSelect(vocabulary.red_1[0], currentSeed).replace('{N}', userNameVal)} ${pseudoSelect(vocabulary.red_1[1], currentSeed + 1)}` },
            { agent: 'agent-yellow', name: 'AGENT YELLOW', text: `${pseudoSelect(vocabulary.yellow_1[0], currentSeed + 2)} ${pseudoSelect(vocabulary.yellow_1[1], currentSeed + 3)}` },
            { agent: 'agent-green', name: 'AGENT GREEN', text: `${pseudoSelect(vocabulary.green_1[0], currentSeed + 4)} ${pseudoSelect(vocabulary.green_1[1], currentSeed + 5).replace('{N}', userNameVal)}` }
        ];

        let step = 0;
        const interval = setInterval(() => {
            if (step < script.length) {
                appendChat(script[step].agent, script[step].name, script[step].text);
                step++;
            } else {
                clearInterval(interval);
                renderStudioCanvas();
            }
        }, 900);
    });

    function appendChat(className, aiName, text) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `chat-message ${className}`;
        div.innerHTML = `<div class="chat-header">${aiName}</div><div class="chat-body">${text}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderStudioCanvas() {
        if (p5Instance) p5Instance.remove();

        const sketch = (p) => {
            p.setup = () => {
                let size = p.min(p.windowWidth * 0.5, 520);
                if (p.windowWidth <= 868) size = p.min(p.windowWidth - 60, 420);
                p.createCanvas(size, size);
                ArtEngine.render(p, currentSeed, artGenre, userNameVal);
                p.noLoop();
            };
        };

        const container = document.getElementById('p5-container');
        container.innerHTML = '';
        p5Instance = new p5(sketch, container);
        document.getElementById('actionBtns').style.display = 'flex';
    }

    function downloadCanvas() {
        if (p5Instance) p5Instance.saveCanvas('art_' + userNameVal, 'jpg');
    }

    /* 전시 시점에만 비밀번호 입력 요청 */
    async function saveToMuseum() {
        const password = prompt("작품 삭제에 사용할 비밀번호(4자리 이상)를 입력하세요:");
        if (password === null) return;
        if (!password || password.trim().length < 4) {
            return alert("비밀번호는 4자리 이상이어야 합니다.");
        }

        try {
            await db.collection("museum_arts").add({
                author: userNameVal,
                password: password.trim(),
                seed: currentSeed,
                genre: artGenre,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("The artwork has been successfully published to the museum archive.");
        } catch (e) {
            console.error(e);
            alert("Error publishing artwork: " + e.message);
        }
    }
</script>
</body>
</html>
