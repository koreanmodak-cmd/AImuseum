        const dialogues = generateDialogueData(userNameVal, currentSeed, currentLang);

    /* Firebase Config */
    const firebaseConfig = {

    /* 다중 화음 앰비언트 엔진 */
    class HarmonicWaveSoundEngine {
        constructor() { this.ctx = null; this.oscs = []; this.gain = null; this.panner = null; }
        start(seed) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
                const now = this.ctx.currentTime;

                this.gain = this.ctx.createGain();
                this.gain.gain.setValueAtTime(0.0001, now);
                this.gain.gain.exponentialRampToValueAtTime(0.038, now + 1.4);

                if (this.ctx.createStereoPanner) {
                    this.panner = this.ctx.createStereoPanner();
                    this.panner.pan.setValueAtTime(-0.5, now);
                    this.gain.connect(this.panner);
                    this.panner.connect(this.ctx.destination);
                } else {
                    this.gain.connect(this.ctx.destination);
                }

                // Seed 기반 베이스 주파수 설정
                const baseFreq = 75 + (seed % 30);
                const freqs = [baseFreq, baseFreq * 1.5, baseFreq * 2, baseFreq * 2.5]; 
                this.oscs = freqs.map((f, i) => {
                    let osc = this.ctx.createOscillator();
                    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f, now);
                    osc.connect(this.gain);
                    osc.start(now);
                    return osc;
                });
            } catch(e) {}
        }
        updateStep(step) {
            if (!this.ctx || this.oscs.length === 0) return;
            const now = this.ctx.currentTime;
            
            this.oscs.forEach((osc, idx) => {
                let currentF = osc.frequency.value;
                osc.frequency.exponentialRampToValueAtTime(currentF + (step * 3), now + 0.6);
            });

            if (this.panner) {
                let panVal = Math.sin(step * 0.8) * 0.7;
                this.panner.pan.setValueAtTime(panVal, now + 0.6);
            }
        }
        stop() {
            if (!this.ctx || !this.gain) return;
            try {
                const now = this.ctx.currentTime;
                this.gain.gain.cancelScheduledValues(now);
                this.gain.gain.setValueAtTime(this.gain.gain.value, now);
                this.gain.gain.exponentialRampToValueAtTime(0.00001, now + 2.2);
                setTimeout(() => {
                    this.oscs.forEach(o => { try { o.stop(); o.disconnect(); } catch(e){} });
                    if (this.ctx && this.ctx.state !== 'closed') { this.ctx.close(); }
                }, 2300);
            } catch(e) {}
        }
    }

    const soundEngine = new HarmonicWaveSoundEngine();
    let currentSeed = 0;
    let userNameVal = "";
    let artGenre = 0;
    let p5Instance = null;
    let galleryP5Instance = null;

    /* 16가지 완벽 일치 통합 파인아트 렌더링 엔진 */
    const ArtEngine = {
        render: function(p, seed, genre, author, currentStep = 7, fadeAlpha = 1.0) {
            p.randomSeed(seed);
            p.noiseSeed(seed);
            
            const w = p.width;
            const h = p.height;
            p.background(4, 4, 6);

            const getAlpha = (targetStep) => {
                if (currentStep < targetStep) return 0;
                if (currentStep === targetStep) return fadeAlpha;
                return 1.0;
            };

            const palettes = [
                [p.color(180, 50, 35), p.color(215, 120, 45), p.color(110, 35, 30), p.color(240, 230, 210)], // Rothko
                [p.color(30, 80, 180), p.color(230, 50, 40), p.color(240, 190, 40), p.color(20, 20, 25), p.color(245, 245, 240)], // Kandinsky
                [p.color(210, 35, 42), p.color(35, 85, 185), p.color(245, 200, 45), p.color(15, 15, 18), p.color(245, 245, 242)], // Mondrian
                [p.color(240, 240, 245), p.color(160, 165, 175), p.color(80, 85, 95), p.color(25, 28, 35), p.color(16, 185, 129)], // Richter
                [p.color(245, 240, 230), p.color(20, 20, 25), p.color(180, 40, 30), p.color(210, 160, 60), p.color(80, 120, 110)], // Pollock
                [p.color(250, 250, 250), p.color(10, 10, 12), p.color(235, 60, 110), p.color(0, 210, 190)], // Op Art
                [p.color(245, 242, 235), p.color(15, 15, 18), p.color(210, 40, 30), p.color(60, 90, 160)], // Malevich
                [p.color(195, 90, 60), p.color(225, 160, 115), p.color(110, 145, 125), p.color(245, 238, 225)], // Terracotta
                [p.color(25, 55, 105), p.color(65, 115, 160), p.color(235, 215, 180), p.color(215, 85, 65)], // Prussian
                [p.color(15, 23, 42), p.color(59, 130, 246), p.color(139, 92, 246), p.color(244, 63, 94), p.color(248, 250, 252)], // Cyber
                [p.color(212, 175, 55), p.color(30, 30, 35), p.color(140, 110, 70), p.color(245, 240, 225)], // Gold Leaf
                [p.color(255, 182, 193), p.color(135, 206, 235), p.color(255, 255, 224), p.color(40, 50, 60)], // Monet
                [p.color(220, 20, 60), p.color(10, 10, 15), p.color(240, 240, 240)], // Fontana Slit
                [p.color(139, 69, 19), p.color(222, 184, 135), p.color(47, 79, 79), p.color(255, 250, 240)], // Eames Wood
                [p.color(0, 255, 127), p.color(255, 0, 128), p.color(10, 10, 15)], // Paik Video
                [p.color(140, 140, 140), p.color(50, 50, 50), p.color(240, 240, 240)] // Minimalist Mono
            ];

            let palette = palettes[p.floor(p.random(0, palettes.length))];

            // STEP 1: Aura
            let a1 = getAlpha(1);
            p.noFill();
            for (let r = w * 1.4; r > 0; r -= w * 0.025) {
                let c = p.random(palette);
                p.stroke(p.red(c), p.green(c), p.blue(c), 6 * a1);
                p.strokeWeight(w * 0.03);
                if (a1 > 0) p.circle(w / 2, h / 2, r);
            }

            // STEP 2~5: Shapes & Vectors
            let a_shapes = getAlpha(Math.min(currentStep, 5));
            if (currentStep >= 2) {
                if (genre === 0) { // Rothko
                    p.noStroke();
                    for (let i = 0; i < 4; i++) {
                        let c = p.random(palette);
                        p.fill(p.red(c), p.green(c), p.blue(c), 140 * a_shapes);
                        let bw = p.random(w * 0.5, w * 0.85);
                        let bh = p.random(h * 0.18, h * 0.38);
                        let bx = (w - bw) / 2 + p.random(-w * 0.03, w * 0.03);
                        let by = p.random(h * 0.08, h * 0.85 - bh);
                        p.rect(bx, by, bw, bh, w * 0.01);
                    }
                } else if (genre === 1) { // Kandinsky
                    for (let i = 0; i < 22; i++) {
                        let c = p.random(palette);
                        let st = p.floor(p.random(4));
                        p.fill(p.red(c), p.green(c), p.blue(c), 140 * a_shapes);
                        p.stroke(0, 0, 0, 100 * a_shapes); p.strokeWeight(w * 0.0015);
                        let sx = p.random(w * 0.1, w * 0.9);
                        let sy = p.random(h * 0.1, h * 0.9);
                        let sr = p.random(w * 0.04, w * 0.22);
                        if (st === 0) p.circle(sx, sy, sr);
                        else if (st === 1) p.rect(sx, sy, sr, sr * p.random(0.5, 2), w * 0.005);
                        else if (st === 2) p.triangle(sx, sy, sx + sr, sy - sr, sx - sr*0.5, sy + sr);
                        else {
                            p.noFill(); p.stroke(p.red(c), p.green(c), p.blue(c), 200 * a_shapes); p.strokeWeight(w * 0.004);
                            p.arc(sx, sy, sr*1.5, sr*1.5, 0, p.PI * p.random(0.8, 1.8));
                        }
                    }
                } else if (genre === 12) { // Fontana Slit Cut
                    p.stroke(4, 4, 6, 240 * a_shapes); p.strokeWeight(w * 0.008);
                    for (let i = 0; i < 4; i++) {
                        let x1 = p.random(w * 0.2, w * 0.8);
                        let y1 = p.random(h * 0.1, h * 0.4);
                        p.line(x1, y1, x1 + p.random(-w * 0.1, w * 0.1), y1 + p.random(h * 0.3, h * 0.5));
                    }
                } else if (genre === 14) { // Paik Video Glitch
                    p.noStroke();
                    for (let i = 0; i < 40; i++) {
                        let c = p.random(palette);
                        p.fill(p.red(c), p.green(c), p.blue(c), 160 * a_shapes);
                        p.rect(p.random(w), p.random(h), p.random(w * 0.1, w * 0.4), p.random(h * 0.005, h * 0.02));
                    }
                } else if (genre === 4) { // Pollock Action Splatter
                    p.noFill();
                    for (let i = 0; i < 150; i++) {
                        let c = p.random(palette);
                        p.stroke(p.red(c), p.green(c), p.blue(c), 160 * a_shapes);
                        p.strokeWeight(p.random(w * 0.001, w * 0.008));
                        p.beginShape();
                        let tx = p.random(w), ty = p.random(h);
                        for (let j = 0; j < 8; j++) {
                            p.curveVertex(tx, ty);
                            tx += p.random(-w * 0.15, w * 0.15);
                            ty += p.random(-h * 0.15, h * 0.15);
                        }
                        p.endShape();
                    }
                } else { // Generic Masterpiece Fallback Pass
                    p.noFill();
                    for (let i = 0; i < 80; i++) {
                        let c = p.random(palette);
                        p.stroke(p.red(c), p.green(c), p.blue(c), 140 * a_shapes);
                        p.strokeWeight(p.random(w * 0.001, w * 0.006));
                        p.line(p.random(w), p.random(h), p.random(w), p.random(h));
                    }
                }
            }

            // STEP 6: 캔버스 실사 질감 패스
            let a6 = getAlpha(6);
            if (a6 > 0) {
                p.loadPixels();
                for (let i = 0; i < p.pixels.length; i += 4) {
                    let grain = (p.random(-1, 1) * 16 * a6);
                    p.pixels[i] = p.constrain(p.pixels[i] + grain, 0, 255);
                    p.pixels[i+1] = p.constrain(p.pixels[i+1] + grain, 0, 255);
                    p.pixels[i+2] = p.constrain(p.pixels[i+2] + grain, 0, 255);
                }
                p.updatePixels();
            }

            // STEP 7: 서명 각인
            let a7 = getAlpha(7);
            if (a7 > 0) {
                let tag = `${(author || 'ANONYMOUS').toUpperCase()} // ED. #${seed.toString(16).toUpperCase().slice(-5)}`;
                p.textAlign(p.RIGHT, p.BOTTOM);
                p.textFont('monospace');
                p.textSize(p.max(8.5, w * 0.022));
                
                p.noStroke();
                p.fill(4, 4, 6, 220 * a7);
                let tw = p.textWidth(tag);
                p.rect(w - tw - (w * 0.05), h - (h * 0.07), tw + (w * 0.025), h * 0.045, 2);
                
                p.fill(244, 244, 245, 210 * a7);
                p.text(tag, w - (w * 0.035), h - (h * 0.035));
            }
        }
    };

    document.getElementById('startBtn').addEventListener('click', () => {
        const nameInput = document.getElementById('userName').value.trim();
        if (!nameInput) return alert(i18n[currentLang].placeholderArtist);
        userNameVal = nameInput;

        startSynthesisPipeline(userNameVal, null);
    });

    function startSynthesisPipeline(author, customSeed) {
        document.getElementById('chatBox').innerHTML = '';
        document.getElementById('actionBtns').style.display = 'none';
        currentChatStep = 0;

        if (customSeed) {
            currentSeed = customSeed;
        } else {
            let hash = 0;
            for (let i = 0; i < author.length; i++) hash = author.charCodeAt(i) + ((hash << 5) - hash);
            currentSeed = Math.abs(hash) + Date.now();
        }

        artGenre = Math.floor((currentSeed % 100) / 6.25) % 16;
        soundEngine.start(currentSeed);
        initStudioCanvas();

        const totalSteps = 7;
        const interval = setInterval(() => {
            if (currentChatStep < totalSteps) {
                currentChatStep++;
                renderChatBoxReactive();
                soundEngine.updateStep(currentChatStep);
                
                if (p5Instance) {
                    p5Instance.fadeToStep(currentChatStep);
                }
            } else {
                clearInterval(interval);
                soundEngine.stop();
                document.getElementById('actionBtns').style.display = 'flex';
            }
        }, 950);
    }

    function initStudioCanvas() {
        if (p5Instance) p5Instance.remove();

        const sketch = (p) => {
            let targetStep = 1;
            let fade = 0.0;
            p.setup = () => {
                let size = p.min(p.windowWidth * 0.5, 520);
                if (p.windowWidth <= 868) size = p.min(p.windowWidth - 60, 420);
                p.createCanvas(size, size);
                p.background(4, 4, 6);
            };

            p.draw = () => {
                if (fade < 1.0) {
                    fade += 0.08;
                    if (fade > 1.0) fade = 1.0;
                    ArtEngine.render(p, currentSeed, artGenre, userNameVal, targetStep, fade);
                }
            };

            p.fadeToStep = (step) => {
                targetStep = step;
                fade = 0.0;
            };
        };

        const container = document.getElementById('p5-container');
        container.innerHTML = '';
        p5Instance = new p5(sketch, container);
    }

    function export4KCanvas() {
        const offscreenSketch = (p) => {
            p.setup = () => {
                p.createCanvas(2400, 2400);
                // 4K 렌더링은 최종 상태(Step 7, Alpha 1.0)로 한 번에 그림
                ArtEngine.render(p, currentSeed, artGenre, userNameVal, 7, 1.0);
                const title = getArtTitle(currentSeed, 'en').replace(/ /g, '_');
                p.saveCanvas(`Art_${title}_${userNameVal}`, 'jpg');
                p.remove();
            };
        };
        new p5(offscreenSketch);
    }

    function sharePermalink() {
        const link = `${window.location.origin}${window.location.pathname}?author=${encodeURIComponent(userNameVal)}&seed=${currentSeed}`;
        navigator.clipboard.writeText(link).then(() => {
            alert(i18n[currentLang].linkCopied);
        });
    }

    function openGalleryDisplayMode() {
        const overlay = document.getElementById('galleryOverlay');
        const target = document.getElementById('gallery-canvas-target');
        target.innerHTML = '';

        if (galleryP5Instance) galleryP5Instance.remove();

        const sketch = (p) => {
            p.setup = () => {
                let sz = p.min(p.windowWidth - 100, p.windowHeight - 120, 680);
                p.createCanvas(sz, sz);
                ArtEngine.render(p, currentSeed, artGenre, userNameVal, 7, 1.0);
                p.noLoop();
            };
        };
        galleryP5Instance = new p5(sketch, target);
        overlay.style.display = 'flex';
    }

    function closeGalleryDisplayMode() {
        document.getElementById('galleryOverlay').style.display = 'none';
        if (galleryP5Instance) galleryP5Instance.remove();
    }

    async function saveToMuseum() {
        const password = prompt(i18n[currentLang].pwPrompt);
        if (password === null) return;
        if (!password || password.trim().length < 4) {
            return alert(i18n[currentLang].pwError);
        }

        try {
            await db.collection("museum_arts").add({
                author: userNameVal,
                password: password.trim(),
                seed: currentSeed,
                genre: artGenre,
                curateCount: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert(i18n[currentLang].publishSuccess);
        } catch (e) {
            console.error(e);
            alert("Error publishing artwork: " + e.message);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
        const urlParams = new URLSearchParams(window.location.search);
        const urlAuthor = urlParams.get('author');
        const urlSeed = urlParams.get('seed');

        if (urlAuthor && urlSeed) {
            document.getElementById('userName').value = urlAuthor;
            userNameVal = urlAuthor;
            startSynthesisPipeline(urlAuthor, parseInt(urlSeed));
        }
    });
</script>
