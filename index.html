<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WORKSPACE : Masterpiece Generative Studio</title>
    <!-- p5.js 및 Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-dark: #08080a;
            --panel-bg: #101014;
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #71717a;
            --agent-red: #f43f5e;
            --agent-yellow: #eab308;
            --agent-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
        }

        header {
            padding: 18px 32px; background: rgba(8, 8, 10, 0.95);
            border-bottom: 1px solid var(--panel-border);
            display: flex; gap: 20px; align-items: center; justify-content: space-between;
            backdrop-filter: blur(12px);
        }
        .header-brand { display: flex; align-items: center; gap: 24px; }
        .header-brand h1 { font-size: 0.88rem; letter-spacing: 3px; font-weight: 600; text-transform: uppercase; color: #fff; }
        
        .nav-btn {
            color: var(--text-muted); text-decoration: none; font-size: 0.8rem; font-weight: 500;
            padding: 7px 14px; border-radius: 4px; border: 1px solid var(--panel-border);
            transition: all 0.2s ease; letter-spacing: 0.5px;
        }
        .nav-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.03); }

        .input-group { display: flex; gap: 10px; width: 100%; max-width: 320px; }
        input {
            flex: 1; padding: 9px 14px; border-radius: 4px; border: 1px solid var(--panel-border);
            background: #141418; color: #fff; font-size: 0.85rem; outline: none; transition: 0.2s;
        }
        input:focus { border-color: rgba(255,255,255,0.3); }
        
        .btn-primary {
            padding: 9px 18px; border: 1px solid var(--panel-border); border-radius: 4px; cursor: pointer;
            background: #f4f4f5; color: #08080a; font-weight: 600; font-size: 0.82rem;
            transition: 0.2s; white-space: nowrap; letter-spacing: 0.5px;
        }
        .btn-primary:hover { background: #e4e4e7; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .chat-panel {
            flex: 1; min-width: 320px; max-width: 36%; background: var(--panel-bg);
            padding: 28px; overflow-y: auto; border-right: 1px solid var(--panel-border);
            display: flex; flex-direction: column; gap: 16px; height: calc(100vh - 65px);
        }
        .chat-placeholder { color: var(--text-muted); font-size: 0.82rem; line-height: 1.7; margin: auto 0; text-align: center; font-weight: 300; }

        .canvas-panel {
            flex: 2; min-width: 320px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            background: #040405; padding: 30px;
        }

        .chat-message {
            opacity: 0; transform: translateY(10px); animation: fadeIn 0.35s forwards ease-out;
            display: flex; flex-direction: column; gap: 5px;
        }
        .chat-header { font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; font-family: monospace; }
        .chat-header::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; }
        
        .agent-red .chat-header { color: var(--agent-red); }
        .agent-red .chat-header::before { background: var(--agent-red); }
        .agent-yellow .chat-header { color: var(--agent-yellow); }
        .agent-yellow .chat-header::before { background: var(--agent-yellow); }
        .agent-green .chat-header { color: var(--agent-green); }
        .agent-green .chat-header::before { background: var(--agent-green); }

        .chat-body {
            background: rgba(255, 255, 255, 0.02); padding: 13px 15px; border-radius: 4px;
            font-size: 0.84rem; line-height: 1.6; color: #a1a1aa; border: 1px solid rgba(255,255,255,0.03); font-weight: 300;
        }

        #p5-container {
            box-shadow: 0 30px 60px rgba(0,0,0,0.95); border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
        }
        
        .action-buttons {
            margin-top: 24px; display: none; gap: 10px; justify-content: center; flex-wrap: wrap;
        }
        .btn-secondary {
            padding: 9px 16px; border-radius: 4px; border: 1px solid var(--panel-border);
            background: #111115; color: #e4e4e7; font-size: 0.8rem; font-weight: 500;
            cursor: pointer; transition: 0.2s; letter-spacing: 0.5px;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); color: #fff; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 868px) {
            body { overflow-y: auto; }
            .main-container { flex-direction: column; }
            .chat-panel { max-width: 100%; height: 320px; border-right: none; border-bottom: 1px solid var(--panel-border); }
            .canvas-panel { min-height: 480px; }
        }
    </style>
</head>

</div>

<script>
    /* Firebase Config */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /* Web Audio API 오디오 앰비언트 엔진 */
    class AmbientSoundEngine {
        constructor() { this.ctx = null; this.osc = null; this.gain = null; }
        start() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
                this.osc = this.ctx.createOscillator();
                this.gain = this.ctx.createGain();
                this.osc.type = 'sine';
                this.osc.frequency.setValueAtTime(98, this.ctx.currentTime);
                this.gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
                this.gain.gain.exponentialRampToValueAtTime(0.035, this.ctx.currentTime + 0.8);
                this.osc.connect(this.gain);
                this.gain.connect(this.ctx.destination);
                this.osc.start();
            } catch(e) {}
        }
        updatePitch(step) {
            if (!this.ctx || !this.osc) return;
            let freq = 98 + (step * 18);
            this.osc.frequency.exponentialRampToValueAtTime(freq, this.ctx.currentTime + 0.5);
        }
        stop() {
            if (!this.ctx) return;
            try {
                this.gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.6);
                setTimeout(() => { if(this.osc) this.osc.stop(); if(this.ctx) this.ctx.close(); }, 700);
            } catch(e) {}
        }
    }

    const soundEngine = new AmbientSoundEngine();
    let currentSeed = 0;
    let userNameVal = "";
    let artGenre = 0;
    let currentDialogue = [];
    let p5Instance = null;

    /* 거장 스타일 이식 2세대 Masterpiece Generative Engine */
    const ArtEngine = {
        renderStep: function(p, seed, genre, author, currentStep, totalSteps) {
            p.randomSeed(seed);
            p.noiseSeed(seed);
            
            const w = p.width;
            const h = p.height;

            p.background(6, 6, 8);

            // 10가지 세련된 파인아트 칼라 팔레트
            const palettes = [
                // 0: Rothko Warm Field
                [p.color(180, 50, 35), p.color(215, 120, 45), p.color(110, 35, 30), p.color(240, 230, 210)],
                // 1: Kandinsky Dynamic
                [p.color(30, 80, 180), p.color(230, 50, 40), p.color(240, 190, 40), p.color(20, 20, 25), p.color(245, 245, 240)],
                // 2: De Stijl Primary
                [p.color(210, 35, 42), p.color(35, 85, 185), p.color(245, 200, 45), p.color(15, 15, 18), p.color(245, 245, 242)],
                // 3: Richter Squeegee Charcoal
                [p.color(240, 240, 245), p.color(160, 165, 175), p.color(80, 85, 95), p.color(25, 28, 35), p.color(16, 185, 129)],
                // 4: Pollock Action Splash
                [p.color(245, 240, 230), p.color(20, 20, 25), p.color(180, 40, 30), p.color(210, 160, 60), p.color(80, 120, 110)],
                // 5: Op Art Moiré
                [p.color(250, 250, 250), p.color(10, 10, 12), p.color(235, 60, 110), p.color(0, 210, 190)],
                // 6: Suprematism Malevich
                [p.color(245, 242, 235), p.color(15, 15, 18), p.color(210, 40, 30), p.color(60, 90, 160)],
                // 7: Terracotta & Sage
                [p.color(195, 90, 60), p.color(225, 160, 115), p.color(110, 145, 125), p.color(245, 238, 225)],
                // 8: Ukiyo-e Prussian
                [p.color(25, 55, 105), p.color(65, 115, 160), p.color(235, 215, 180), p.color(215, 85, 65)],
                // 9: Cyber Minimalist
                [p.color(15, 23, 42), p.color(59, 130, 246), p.color(139, 92, 246), p.color(244, 63, 94), p.color(248, 250, 252)]
            ];

            let palette = palettes[p.floor(p.random(0, palettes.length))];

            // STEP 1: 백그라운드 색면 & 대기층 오라 (Rothko Style Base)
            if (currentStep >= 1) {
                p.noFill();
                for (let r = w * 1.4; r > 0; r -= w * 0.025) {
                    let c = p.random(palette);
                    p.stroke(p.red(c), p.green(c), p.blue(c), 5);
                    p.strokeWeight(w * 0.03);
                    p.circle(w / 2, h / 2, r);
                }

                // 큰 은은한 색면 반점 2~3개
                p.noStroke();
                for (let i = 0; i < 3; i++) {
                    let c = p.random(palette);
                    p.fill(p.red(c), p.green(c), p.blue(c), 25);
                    p.rect(p.random(w * 0.1, w * 0.5), p.random(h * 0.1, h * 0.5), p.random(w * 0.3, w * 0.6), p.random(h * 0.3, h * 0.6), w * 0.04);
                }
            }

            // STEP 2~5: 거장 알고리즘 레이어 연산
            if (currentStep >= 2) {
                if (genre === 0) {
                    // [장르 0: Rothko Layered Color Field]
                    p.noStroke();
                    let blocks = p.floor(p.map(Math.min(currentStep, 5), 2, 5, 2, 6));
                    for (let i = 0; i < blocks; i++) {
                        let c = p.random(palette);
                        p.fill(p.red(c), p.green(c), p.blue(c), p.random(110, 190));
                        let bw = p.random(w * 0.5, w * 0.85);
                        let bh = p.random(h * 0.18, h * 0.38);
                        let bx = (w - bw) / 2 + p.random(-w * 0.03, w * 0.03);
                        let by = p.random(h * 0.08, h * 0.85 - bh);
                        p.rect(bx, by, bw, bh, w * 0.01);
                    }
                } 
                else if (genre === 1) {
                    // [장르 1: Kandinsky Dynamic Composition]
                    let shapes = p.floor(p.map(Math.min(currentStep, 5), 2, 5, 8, 26));
                    for (let i = 0; i < shapes; i++) {
                        let c = p.random(palette);
                        let st = p.floor(p.random(4));
                        p.fill(p.red(c), p.green(c), p.blue(c), p.random(120, 210));
                        p.stroke(0, 0, 0, 120); p.strokeWeight(w * 0.0015);
                        
                        let sx = p.random(w * 0.1, w * 0.9);
                        let sy = p.random(h * 0.1, h * 0.9);
                        let sr = p.random(w * 0.04, w * 0.22);
                        
                        if (st === 0) p.circle(sx, sy, sr);
                        else if (st === 1) p.rect(sx, sy, sr, sr * p.random(0.5, 2), w * 0.005);
                        else if (st === 2) p.triangle(sx, sy, sx + sr, sy - sr, sx - sr*0.5, sy + sr);
                        else {
                            p.noFill(); p.stroke(p.random(palette)); p.strokeWeight(w * 0.004);
                            p.arc(sx, sy, sr*1.5, sr*1.5, 0, p.PI * p.random(0.8, 1.8));
                        }
                    }
                    // 역동적 사선 축
                    p.stroke(255, 255, 255, 140); p.strokeWeight(w * 0.003);
                    p.line(w * 0.1, h * 0.85, w * 0.9, h * 0.15);
                } 
                else if (genre === 2) {
                    // [장르 2: Mondrian De Stijl Recursive Grid]
                    p.stroke(18, 18, 22); p.strokeWeight(w * 0.012);
                    let cols = p.floor(p.random(3, 6));
                    let rows = p.floor(p.random(3, 6));
                    let cellW = w / cols;
                    let cellH = h / rows;
                    for (let c = 0; c < cols; c++) {
                        for (let r = 0; r < rows; r++) {
                            if (p.random(1) > 0.45) {
                                let col = p.random(palette);
                                p.fill(col);
                            } else {
                                p.fill(245, 245, 240);
                            }
                            p.rect(c * cellW, r * cellH, cellW, cellH);
                        }
                    }
                } 
                else if (genre === 3) {
                    // [장르 3: Richter Squeegee Smear]
                    p.noStroke();
                    let bands = p.floor(p.map(Math.min(currentStep, 5), 2, 5, 20, 80));
                    for (let i = 0; i < bands; i++) {
                        let c = p.random(palette);
                        p.fill(p.red(c), p.green(c), p.blue(c), p.random(100, 200));
                        let sy = p.random(h);
                        let sh = p.random(h * 0.01, h * 0.08);
                        p.rect(0, sy, w, sh);
                        // 스퀴지 끌림 수직 노이즈
                        if (p.random(1) > 0.5) {
                            p.fill(255, 255, 255, random(30, 80));
                            p.rect(p.random(w), sy, p.random(w * 0.05, w * 0.2), sh * p.random(2, 5));
                        }
                    }
                } 
                else if (genre === 4) {
                    // [장르 4: Pollock Action Painting Drips & Splatter]
                    p.noFill();
                    let drips = p.floor(p.map(Math.min(currentStep, 5), 2, 5, 40, 180));
                    for (let i = 0; i < drips; i++) {
                        let c = p.random(palette);
                        p.stroke(p.red(c), p.green(c), p.blue(c), p.random(120, 220));
                        p.strokeWeight(p.random(w * 0.001, w * 0.008));
                        p.beginShape();
                        let x = p.random(w), y = p.random(h);
                        for (let j = 0; j < 8; j++) {
                            p.curveVertex(x, y);
                            x += p.random(-w * 0.15, w * 0.15);
                            y += p.random(-h * 0.15, h * 0.15);
                        }
                        p.endShape();
                        
                        // 물감 방울 비산 (Splatter)
                        if (p.random(1) > 0.4) {
                            p.noStroke(); p.fill(p.red(c), p.green(c), p.blue(c), p.random(150, 240));
                            p.circle(x, y, p.random(w * 0.004, w * 0.02));
                        }
                    }
                } 
                else if (genre === 5) {
                    // [장르 5: Op Art Moiré Wave Distortion]
                    p.noFill(); p.strokeWeight(w * 0.002);
                    let lines = p.floor(p.map(Math.min(currentStep, 5), 2, 5, 40, 120));
                    for (let i = 0; i < lines; i++) {
                        let c = p.random(palette);
                        p.stroke(p.red(c), p.green(c), p.blue(c), p.random(140, 230));
                        p.beginShape();
                        for (let x = 0; x <= w; x += w * 0.02) {
                            let angle = (x * 0.015) + (i * 0.1);
                            let y = (i * (h / lines)) + p.sin(angle) * (h * 0.05);
                            p.vertex(x, y);
                        }
                        p.endShape();
                    }
                } 
                else if (genre === 6) {
                    // [장르 6: Suprematism Malevich Tilts]
                    p.noStroke();
                    let polys = p.floor(p.map(Math.min(currentStep, 5), 2, 5, 5, 18));
                    for (let i = 0; i < polys; i++) {
                        let c = p.random(palette);
                        p.fill(p.red(c), p.green(c), p.blue(c), p.random(140, 230));
                        p.push();
                        p.translate(p.random(w * 0.15, w * 0.85), p.random(h * 0.15, h * 0.85));
                        p.rotate(p.random(-p.QUARTER_PI, p.QUARTER_PI));
                        p.rect(0, 0, p.random(w * 0.08, w * 0.4), p.random(h * 0.04, h * 0.25));
                        p.pop();
                    }
                } 
                else {
                    // [장르 7: Zaha Hadid Parametric Curves]
                    p.noFill(); p.strokeWeight(w * 0.002);
                    let ribbons = p.floor(p.map(Math.min(currentStep, 5), 2, 5, 30, 110));
                    for (let i = 0; i < ribbons; i++) {
                        let c = p.random(palette);
                        p.stroke(p.red(c), p.green(c), p.blue(c), p.random(100, 200));
                        p.beginShape();
                        let x = random(w), y = random(h);
                        for (let j = 0; j < 15; j++) {
                            p.vertex(x, y);
                            let angle = p.noise(x * 0.003, y * 0.003) * p.TWO_PI * 6;
                            x += p.cos(angle) * (w * 0.02);
                            y += p.sin(angle) * (h * 0.02);
                        }
                        p.endShape();
                    }
                }
            }

            // STEP 6: 캔버스 실사 질감 오버레이 & 필름 그레인
            if (currentStep >= 6) {
                p.loadPixels();
                for (let i = 0; i < p.pixels.length; i += 4) {
                    let grain = (p.random(-1, 1) * 15);
                    p.pixels[i] = p.constrain(p.pixels[i] + grain, 0, 255);
                    p.pixels[i+1] = p.constrain(p.pixels[i+1] + grain, 0, 255);
                    p.pixels[i+2] = p.constrain(p.pixels[i+2] + grain, 0, 255);
                }
                p.updatePixels();

                // STEP 7: 우측 하단 아티스트 시그니처 각인
                p.push();
                let tag = `${(author || 'ANONYMOUS').toUpperCase()} // ED. #${seed.toString(16).toUpperCase().slice(-5)}`;
                p.textAlign(p.RIGHT, p.BOTTOM);
                p.textFont('monospace');
                p.textSize(p.max(8.5, w * 0.022));
                
                p.noStroke();
                p.fill(6, 6, 8, 220);
                let tw = p.textWidth(tag);
                p.rect(w - tw - (w * 0.05), h - (h * 0.07), tw + (w * 0.025), h * 0.045, 2);
                
                p.fill(244, 244, 245, 210);
                p.text(tag, w - (w * 0.035), h - (h * 0.035));
                p.pop();
            }
        },
        render: function(p, seed, genre, author) {
            this.renderStep(p, seed, genre, author, 7, 7);
        }
    };

    /* 7단계 깊이 있는 AI 큐레이팅 대화 모듈 */
    function generate7StepDialogue(author, seed) {
        return [
            { agent: 'agent-red', name: 'RED // 01', text: `Initiating semantic spectral scan for '${author}'. Primary color field aura forming.` },
            { agent: 'agent-yellow', name: 'YELLOW // 02', text: `Acknowledged Red. Deconstructing spatial proportions and structural grid axes.` },
            { agent: 'agent-green', name: 'GREEN // 03', text: `Evaluating tonal equilibrium. Introducing high-opacity gradient layers.` },
            { agent: 'agent-red', name: 'RED // 01', text: `Proposing contrast escalation inspired by modernist masterworks.` },
            { agent: 'agent-yellow', name: 'YELLOW // 02', text: `Intersecting parametric noise vectors. Primary composition stabilized.` },
            { agent: 'agent-red', name: 'RED // 01', text: `Visual tension balanced. Harmony established between structure and fluid motion.` },
            { agent: 'agent-green', name: 'GREEN // 03', text: `Canvas texture & film grain pass complete. Stamped signature ED. #${seed.toString(16).slice(-5)}.` }
        ];
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        const nameInput = document.getElementById('userName').value.trim();
        if (!nameInput) return alert("Please enter an artist name.");
        userNameVal = nameInput;

        startSynthesisPipeline(userNameVal, null);
    });

    function startSynthesisPipeline(author, customSeed) {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        document.getElementById('actionBtns').style.display = 'none';

        if (customSeed) {
            currentSeed = customSeed;
        } else {
            let hash = 0;
            for (let i = 0; i < author.length; i++) hash = author.charCodeAt(i) + ((hash << 5) - hash);
            currentSeed = Math.abs(hash) + Date.now();
        }

        artGenre = Math.floor((currentSeed % 100) / 12.5) % 8; // 8가지 장르 선택
        currentDialogue = generate7StepDialogue(author, currentSeed);

        soundEngine.start();
        initStudioCanvas();

        let step = 0;
        const totalSteps = currentDialogue.length;
        const interval = setInterval(() => {
            if (step < totalSteps) {
                appendChat(currentDialogue[step].agent, currentDialogue[step].name, currentDialogue[step].text);
                soundEngine.updatePitch(step + 1);
                if (p5Instance) {
                    p5Instance.drawStep(step + 1, totalSteps);
                }
                step++;
            } else {
                clearInterval(interval);
                soundEngine.stop();
                document.getElementById('actionBtns').style.display = 'flex';
            }
        }, 850);
    }

    function appendChat(className, aiName, text) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `chat-message ${className}`;
        div.innerHTML = `<div class="chat-header">${aiName}</div><div class="chat-body">${text}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function initStudioCanvas() {
        if (p5Instance) p5Instance.remove();

        const sketch = (p) => {
            p.setup = () => {
                let size = p.min(p.windowWidth * 0.5, 520);
                if (p.windowWidth <= 868) size = p.min(p.windowWidth - 60, 420);
                p.createCanvas(size, size);
                p.background(6, 6, 8);
                p.noLoop();
            };
            p.drawStep = (step, total) => {
                ArtEngine.renderStep(p, currentSeed, artGenre, userNameVal, step, total);
            };
        };

        const container = document.getElementById('p5-container');
        container.innerHTML = '';
        p5Instance = new p5(sketch, container);
    }

    /* 4K 고해상도 백그라운드 내보내기 */
    function export4KCanvas() {
        const offscreenSketch = (p) => {
            p.setup = () => {
                p.createCanvas(2400, 2400);
                ArtEngine.render(p, currentSeed, artGenre, userNameVal);
                p.saveCanvas(`masterpiece_4K_${userNameVal}`, 'jpg');
                p.remove();
            };
        };
        new p5(offscreenSketch);
    }

    /* 고유 딥링크(Permalink) 공유 */
    function sharePermalink() {
        const link = `${window.location.origin}${window.location.pathname}?author=${encodeURIComponent(userNameVal)}&seed=${currentSeed}`;
        navigator.clipboard.writeText(link).then(() => {
            alert("Permalink URL copied to clipboard!");
        });
    }

    /* 박물관 게시 */
    async function saveToMuseum() {
        const password = prompt("Set a deletion password (4+ digits) for this artwork:");
        if (password === null) return;
        if (!password || password.trim().length < 4) {
            return alert("Password must be at least 4 characters.");
        }

        try {
            await db.collection("museum_arts").add({
                author: userNameVal,
                password: password.trim(),
                seed: currentSeed,
                genre: artGenre,
                curateCount: 0,
                dialogue: currentDialogue,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("The artwork & dialogue transcript have been published to the museum.");
        } catch (e) {
            console.error(e);
            alert("Error publishing artwork: " + e.message);
        }
    }

    /* 딥링크 접속 감지 처리 */
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlAuthor = urlParams.get('author');
        const urlSeed = urlParams.get('seed');

        if (urlAuthor && urlSeed) {
            document.getElementById('userName').value = urlAuthor;
            userNameVal = urlAuthor;
            startSynthesisPipeline(urlAuthor, parseInt(urlSeed));
        }
    });
</script>
