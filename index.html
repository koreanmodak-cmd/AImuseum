<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace : Generative Art</title>
    <!-- p5.js 및 html2canvas 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --red-color: #ef4444;
            --yellow-color: #f59e0b;
            --green-color: #10b981;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
        }
        header {
            padding: 15px 20px; background: rgba(0,0,0,0.4); border-bottom: 1px solid #334155;
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;
        }
        .header-title { display: flex; align-items: center; gap: 15px; }
        .header-title h2 { margin: 0; font-size: 1.3rem; }
        .museum-link { color: #3b82f6; text-decoration: none; font-weight: bold; font-size: 0.95rem; }
        .museum-link:hover { text-decoration: underline; }
        .input-group { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; max-width: 450px; }
        input { 
            flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; 
            background: #0f172a; color: white; min-width: 140px; font-size: 0.95rem;
        }
        button {
            padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;
            background: #3b82f6; color: white; font-weight: bold; transition: 0.2s; font-size: 0.95rem;
            white-space: nowrap;
        }
        button:hover { background: #2563eb; }
        .main-container { display: flex; flex: 1; overflow: hidden; flex-wrap: wrap; }
        .chat-panel {
            flex: 1; min-width: 300px; max-width: 35%; background: var(--panel-bg);
            padding: 20px; overflow-y: auto; border-right: 1px solid #334155; max-height: calc(100vh - 70px);
        }
        .canvas-panel {
            flex: 2; min-width: 300px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; background: #020617;
            padding: 20px;
        }
        .chat-message { margin-bottom: 15px; opacity: 0; transform: translateY(10px); animation: fadeIn 0.4s forwards; }
        .chat-name { font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .chat-text { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; font-size: 0.92rem; line-height: 1.45; }
        
        .agent-red .chat-name { color: var(--red-color); }
        .agent-yellow .chat-name { color: var(--yellow-color); }
        .agent-green .chat-name { color: var(--green-color); }

        #p5-container { box-shadow: 0 10px 30px rgba(0,0,0,0.6); border-radius: 8px; overflow: hidden; }
        .action-buttons { margin-top: 20px; display: none; gap: 12px; flex-wrap: wrap; justify-content: center; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            body { overflow-y: auto; }
            .main-container { flex-direction: column; }
            .chat-panel { max-width: 100%; height: 300px; border-right: none; border-bottom: 1px solid #334155; }
            .canvas-panel { min-height: 500px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">
        <h2>🎨 AI Workspace</h2>
        <a href="museum.html" class="museum-link">🏛️ 박물관 구경하기</a>
    </div>
    <div class="input-group">
        <input type="text" id="userName" placeholder="이름을 입력하세요 (예: 홍길동)" autocomplete="off">
        <button id="startBtn">작품 창작하기</button>
    </div>
</header>

<div class="main-container">
    <div class="chat-panel" id="chatBox">
        <div style="color: #94a3b8; font-size: 0.9rem;">이름을 입력하고 창작하기를 누르면 에이전트들이 대화를 시작합니다.</div>
    </div>
    <div class="canvas-panel">
        <div id="p5-container"></div>
        <div class="action-buttons" id="actionBtns">
            <button onclick="downloadCanvas()">🖼️ JPG로 저장</button>
            <button onclick="saveToMuseum()" style="background: #10b981;">🏛️ 박물관에 전시하기</button>
        </div>
    </div>
</div>

<script>
    /* =========================================
       1. Firebase 초기화
       ========================================= */
    const firebaseConfig = {
        apiKey: "AIzaSyBV08YxtJZ0y6NgXOlRG26mna-jEfsS5tk",
        authDomain: "aimuseum-8c30b.firebaseapp.com",
        projectId: "aimuseum-8c30b",
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /* =========================================
       2. 상태 변수 및 한글 분해 함수
       ========================================= */
    let currentSeed = 0;
    let extractedLetters = [];
    let artGenre = 0;

    function extractHangul(str) {
        const chosung = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
        const jungsung = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
        let result = [];
        for (let i = 0; i < str.length; i++) {
            let code = str.charCodeAt(i) - 44032;
            if (code > -1 && code < 11172) {
                result.push(chosung[Math.floor(code / 588)]);
                result.push(jungsung[Math.floor((code % 588) / 28)]);
            } else {
                result.push(str[i]);
            }
        }
        return result.length > 0 ? result : ["A", "R", "T"];
    }

    /* =========================================
       3. 동적 AI 대화 엔진
       ========================================= */
    const dialogFragments = {
        red_intro: ["이름의 파동을 스캔 중이야.", "입력값의 기하학적 궤적을 확인했어.", "공간의 온도와 색조를 결정하는 중이야."],
        red_action: ["메인 베이스는 강렬한 붉은 난색 톤으로 설정할게.", "차가운 새벽빛 그라데이션으로 베이스를 바닥에敷 깔아볼게.", "대비감을 강조하기 위해 어두운 딥 블루 테마를 선택할게."],
        yellow_intro: ["레드의 색조를 넘겨받았어.", "좋아, 난 구조적 구도와 그리드를 배치할게.", "이름 속 입자들을 공간에 흩뿌릴 준비가 됐어."],
        yellow_genre: ["바우하우스 스타일의 과감한 도형 배치를 시도해보자.", "유체 역학에 기반한 유기적 곡선 패턴(Flow Field)을 적용 중이야.", "네온 기하학 라인들과 글리치 노이즈로 공간을 구성해볼게."],
        green_intro: ["조형 작업이 마무리 단계에 접어들었어.", "빛의 질감과 깊이감을 연산하는 중이야.", "마지막 유기적 레이어를 얹을게."],
        green_action: ["추출된 자음/모음 조각들을 빛 입자 형태로 배치했어.", "이름의 파편들을 3D 관성 회전 구조로 흩뿌렸어.", "텍스처 입자를 입히고 감각적인 갤러리 아트로 완성을 끝마쳤어."]
    };

    function getRandom(array, seed) {
        let x = Math.sin(seed) * 10000;
        return array[Math.floor((x - Math.floor(x)) * array.length)];
    }

    /* =========================================
       4. 메인 이벤트 제어
       ========================================= */
    document.getElementById('startBtn').addEventListener('click', () => {
        const name = document.getElementById('userName').value.trim();
        if (!name) return alert("이름을 입력해주세요!");

        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        document.getElementById('actionBtns').style.display = 'none';
        
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        currentSeed = Math.abs(hash) + Date.now();
        
        randomSeed(currentSeed);
        noiseSeed(currentSeed);

        extractedLetters = extractHangul(name);
        artGenre = Math.floor(random(0, 4));

        let step = 0;
        const interval = setInterval(() => {
            if (step === 0) {
                appendChat('agent-red', '🔴 Red', `${getRandom(dialogFragments.red_intro, currentSeed)} ${getRandom(dialogFragments.red_action, currentSeed + 1)}`);
            } else if (step === 1) {
                appendChat('agent-yellow', '🟡 Yellow', `${getRandom(dialogFragments.yellow_intro, currentSeed + 2)} ${getRandom(dialogFragments.yellow_genre, currentSeed + 3)}`);
            } else if (step === 2) {
                appendChat('agent-green', '🟢 Green', `${getRandom(dialogFragments.green_intro, currentSeed + 4)} ${getRandom(dialogFragments.green_action, currentSeed + 5)}`);
            } else {
                clearInterval(interval);
                generateArt();
            }
            step++;
        }, 1300);
    });

    function appendChat(className, aiName, text) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `chat-message ${className}`;
        div.innerHTML = `<div class="chat-name">${aiName}</div><div class="chat-text">${text}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* =========================================
       5. p5.js 아트 생성 엔진
       ========================================= */
    function setup() {
        let size = min(windowWidth * 0.55, 550);
        if (windowWidth <= 768) size = min(windowWidth - 40, 450);
        let canvas = createCanvas(size, size);
        canvas.parent('p5-container');
        background(15, 23, 42);
        noLoop();
    }

    function generateArt() {
        randomSeed(currentSeed);
        noiseSeed(currentSeed);
        background(15, 23, 42);

        let colors = [
            color(random(180, 255), random(50, 120), random(80, 150)),
            color(random(50, 120), random(180, 255), random(180, 255)),
            color(random(230, 255), random(180, 240), random(50, 100))
        ];

        if (artGenre === 0) {
            noStroke();
            for (let i = 0; i < 22; i++) {
                fill(random(colors));
                let shapeType = floor(random(3));
                if (shapeType === 0) rect(random(width), random(height), random(30, 180), random(30, 180));
                else if (shapeType === 1) circle(random(width), random(height), random(40, 220));
                else triangle(random(width), random(height), random(width), random(height), random(width), random(height));
            }
        } 
        else if (artGenre === 1) {
            noFill();
            strokeWeight(1.8);
            for (let i = 0; i < 400; i++) {
                stroke(random(colors));
                beginShape();
                let x = random(width), y = random(height);
                for (let j = 0; j < 18; j++) {
                    vertex(x, y);
                    let angle = noise(x * 0.008, y * 0.008) * TWO_PI * 4;
                    x += cos(angle) * 9;
                    y += sin(angle) * 9;
                }
                endShape();
            }
        }
        else if (artGenre === 2) {
            strokeWeight(random(1.5, 4));
            for (let i = 0; i < 180; i++) {
                stroke(random(colors));
                let x = random(width), y = random(height);
                line(x, y, x + random(-120, 120), y);
                if (random(1) > 0.75) {
                    noStroke();
                    fill(random(colors));
                    rect(x, y, random(10, 60), random(3, 12));
                }
            }
        }
        else {
            noStroke();
            for (let i = 0; i < 16; i++) {
                let c = random(colors);
                fill(red(c), green(c), blue(c), random(70, 140));
                circle(random(width), random(height), random(120, 380));
            }
        }

        textAlign(CENTER, CENTER);
        for (let i = 0; i < extractedLetters.length; i++) {
            push();
            translate(random(width), random(height));
            rotate(random(TWO_PI));
            fill(255, 255, 255, random(80, 180));
            textSize(random(25, 110));
            text(extractedLetters[i], 0, 0);
            pop();
        }

        document.getElementById('actionBtns').style.display = 'flex';
    }

    /* =========================================
       6. 저장 및 박물관 연동
       ========================================= */
    function downloadCanvas() {
        saveCanvas('ai_art_' + Date.now(), 'jpg');
    }

    async function saveToMuseum() {
        const name = document.getElementById('userName').value.trim();
        try {
            await db.collection("museum_arts").add({
                author: name,
                seed: currentSeed,
                genre: artGenre,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("🏛️ 박물관에 성공적으로 전시되었습니다!");
        } catch (e) {
            console.error(e);
            alert("전시 중 오류가 발생했습니다: " + e.message);
        }
    }
</script>
</body>
</html>
